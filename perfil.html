<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandooers · Mi perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8B5CF6;--t:#0891B2;--ink:#2D2D2D;--mut:#8F8F8F;--bg:#FAFAFA;--line:#E8E0E5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#4A4A4A;padding:40px 24px}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.av{width:52px;height:52px;border-radius:50%;background:var(--p);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
h1{font-size:22px;font-weight:800;color:var(--ink)}
.role{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 10px;border-radius:100px;background:#F5F0EE;color:var(--p);margin-top:4px}
.role.admin{background:#e5dbff;color:#6741d9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:24px}
.card h2{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
.card p{font-size:13px;color:var(--mut);margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:12px 0 5px}
input{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
input:focus{outline:none;border-color:var(--p)}
button{margin-top:18px;font-family:inherit;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--p);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
button:disabled{opacity:.5}
.msg{font-size:13px;margin-top:12px;min-height:18px}
.back{display:inline-block;margin-top:26px;color:var(--p);font-weight:600;text-decoration:none;font-size:14px}
.hand{font-family:'Caveat',cursive;color:var(--t);font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <p class="hand">Tu cuenta</p>
  <div class="top">
    <div class="av" id="av">·</div>
    <div><h1 id="name">…</h1><span class="role" id="role"></span></div>
  </div>
  <div class="card">
    <h2>Cambiar contraseña</h2>
    <p>Introduce tu contraseña actual y la nueva (mínimo 8 caracteres).</p>
    <form id="f">
      <label for="o">Contraseña actual</label>
      <input id="o" type="password" autocomplete="current-password" required>
      <label for="n">Contraseña nueva</label>
      <input id="n" type="password" autocomplete="new-password" required>
      <button id="b" type="submit">Guardar</button>
      <div class="msg" id="m"></div>
    </form>
  </div>
  <a class="back" href="/hub.html">← Volver a Brandooers</a>
</div>
<script>
(async function(){
  try{
    var me=await (await fetch('/auth/me')).json();
    if(!me.user){ location.href='/login.html'; return; }
    document.getElementById('name').textContent=me.user;
    document.getElementById('av').textContent=me.user.charAt(0).toUpperCase();
    var rl=document.getElementById('role'); rl.textContent=me.role==='admin'?'Administrador':'Miembro'; if(me.role==='admin')rl.classList.add('admin');
  }catch(_){ location.href='/login.html'; }
})();
var m=document.getElementById('m'),b=document.getElementById('b');
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault(); m.textContent=''; b.disabled=true;
  try{
    var r=await fetch('/auth/password',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({old:document.getElementById('o').value,'new':document.getElementById('n').value})});
    var d=await r.json();
    if(r.ok&&d.ok){ m.style.color='#2b8a3e'; m.textContent='Contraseña actualizada.'; document.getElementById('f').reset(); }
    else { m.style.color='#c92a2a'; m.textContent=d.error||'No se pudo cambiar'; }
  }catch(_){ m.style.color='#c92a2a'; m.textContent='Error de conexión'; }
  b.disabled=false;
});
</script>
</body>
</html>
