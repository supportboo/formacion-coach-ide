ill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="1460" y="321" width="300" height="94" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="1460" y="437" width="300" height="94" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="1790" y="205" width="300" height="94" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="1790" y="321" width="300" height="94" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="1790" y="437" width="300" height="94" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="2120" y="205" width="300" height="94" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="2120" y="321" width="300" height="94" rx="8" fill="#ffec99" stroke="#e8a90a" stroke-width="2"/><rect x="2120" y="437" width="300" height="94" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><line x1="440" y1="368" x2="470" y2="368" stroke="#4263eb" stroke-width="3" marker-end="url(#a)"/><line x1="770" y1="368" x2="800" y2="368" stroke="#4263eb" stroke-width="3" marker-end="url(#a)"/><line x1="1100" y1="368" x2="1130" y2="368" stroke="#4263eb" stroke-width="3" marker-end="url(#a)"/><line x1="1430" y1="368" x2="1460" y2="368" stroke="#4263eb" stroke-width="3" marker-end="url(#a)"/><line x1="1760" y1="368" x2="1790" y2="368" stroke="#4263eb" stroke-width="3" marker-end="url(#a)"/><line x1="2090" y1="368" x2="2120" y2="368" stroke="#4263eb" stroke-width="3" marker-end="url(#a)"/><rect x="140" y="577" width="740" height="360" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="910" y="577" width="740" height="360" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1680" y="577" width="740" height="360" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="140" y="60" font-size="26" fill="#1e1e1e" text-anchor="start">Brandooers · Estrategia de producto y negocio — de la adopción al ROI</text><text x="140" y="88" font-size="14" fill="#666" text-anchor="start">Estado real 2026-09-01. Verde = construido con test pasando (Fases 0-7, platform/). El conocimiento se queda, se propaga y se mide.</text><text x="166" y="122" font-size="12" fill="#2f9e44" text-anchor="start">construido + test</text><text x="386" y="122" font-size="12" fill="#e8a90a" text-anchor="start">parcial</text><text x="566" y="122" font-size="12" fill="#e03131" text-anchor="start">pendiente / diferido</text><text x="290" y="172" font-size="14" fill="#343a40" text-anchor="middle">1 · ADOPCIÓN</text><text x="290" y="241" font-size="12" fill="#1e1e1e" text-anchor="middle">HOME + CAPTACIÓN</text><text x="290" y="256" font-size="12" fill="#1e1e1e" text-anchor="middle">brandooers.com desplegada</text><text x="290" y="271" font-size="12" fill="#1e1e1e" text-anchor="middle">piloto 90 días</text><text x="290" y="357" font-size="12" fill="#1e1e1e" text-anchor="middle">ONBOARDING</text><text x="290" y="372" font-size="12" fill="#1e1e1e" text-anchor="middle">por qué · para qué</text><text x="290" y="387" font-size="12" fill="#1e1e1e" text-anchor="middle">sector · puesto (test)</text><text x="290" y="473" font-size="12" fill="#1e1e1e" text-anchor="middle">LÍNEA BASE DEL PILOTO</text><text x="290" y="488" font-size="12" fill="#1e1e1e" text-anchor="middle">captura del punto</text><text x="290" y="503" font-size="12" fill="#1e1e1e" text-anchor="middle">de partida (test)</text><text x="620" y="172" font-size="14" fill="#343a40" text-anchor="middle">2 · APRENDIZAJE</text><text x="620" y="241" font-size="12" fill="#1e1e1e" text-anchor="middle">RUTA PERSONALIZADA</text><text x="620" y="256" font-size="12" fill="#1e1e1e" text-anchor="middle">por sector y puesto</text><text x="620" y="271" font-size="12" fill="#1e1e1e" text-anchor="middle">(gen parcial)</text><text x="620" y="357" font-size="12" fill="#1e1e1e" text-anchor="middle">CONTENIDO + RAG</text><text x="620" y="372" font-size="12" fill="#1e1e1e" text-anchor="middle">asocia por significado</text><text x="620" y="387" font-size="12" fill="#1e1e1e" text-anchor="middle">ingesta/recuperación (test)</text><text x="620" y="473" font-size="12" fill="#1e1e1e" text-anchor="middle">TEST -&gt; NIVEL 1</text><text x="620" y="488" font-size="12" fill="#1e1e1e" text-anchor="middle">autocorregido</text><text x="620" y="503" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="950" y="172" font-size="14" fill="#343a40" text-anchor="middle">3 · VALIDACIÓN</text><text x="950" y="241" font-size="12" fill="#1e1e1e" text-anchor="middle">CASO PRÁCTICO + RÚBRICA</text><text x="950" y="256" font-size="12" fill="#1e1e1e" text-anchor="middle">su trabajo real</text><text x="950" y="271" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="950" y="357" font-size="12" fill="#1e1e1e" text-anchor="middle">VALIDACIÓN HUMANA</text><text x="950" y="372" font-size="12" fill="#1e1e1e" text-anchor="middle">responsable/nivel valida</text><text x="950" y="387" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="950" y="473" font-size="12" fill="#1e1e1e" text-anchor="middle">GATE PROGRESO</text><text x="950" y="488" font-size="12" fill="#1e1e1e" text-anchor="middle">no validas -&gt; practicas</text><text x="950" y="503" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1280" y="172" font-size="14" fill="#343a40" text-anchor="middle">4 · PROPAGACIÓN</text><text x="1280" y="189" font-size="14" fill="#343a40" text-anchor="middle">&amp; CARRERA</text><text x="1280" y="241" font-size="12" fill="#1e1e1e" text-anchor="middle">NIVELES POR COMPETENCIA</text><text x="1280" y="256" font-size="12" fill="#1e1e1e" text-anchor="middle">En formación·Aplica·Referente</text><text x="1280" y="271" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1280" y="357" font-size="12" fill="#1e1e1e" text-anchor="middle">CASCADA COACH -&gt;</text><text x="1280" y="372" font-size="12" fill="#1e1e1e" text-anchor="middle">COACH DE COACHES -&gt;</text><text x="1280" y="387" font-size="12" fill="#1e1e1e" text-anchor="middle">INSPIRADOR (test)</text><text x="1280" y="473" font-size="12" fill="#1e1e1e" text-anchor="middle">PUNTOS + ANTIFRAUDE</text><text x="1280" y="488" font-size="12" fill="#1e1e1e" text-anchor="middle">paga al aprobar el alumno</text><text x="1280" y="503" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1610" y="172" font-size="14" fill="#343a40" text-anchor="middle">5 · CONFIG. EMPRESA</text><text x="1610" y="241" font-size="12" fill="#1e1e1e" text-anchor="middle">MOTOR DE REGLAS</text><text x="1610" y="256" font-size="12" fill="#1e1e1e" text-anchor="middle">disparador -&gt; recompensa</text><text x="1610" y="271" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1610" y="357" font-size="12" fill="#1e1e1e" text-anchor="middle">TÍTULOS + CERTIFICADOS</text><text x="1610" y="372" font-size="12" fill="#1e1e1e" text-anchor="middle">propios · verificables</text><text x="1610" y="387" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1610" y="473" font-size="12" fill="#1e1e1e" text-anchor="middle">COMPENSACIÓN CONFIG.</text><text x="1610" y="488" font-size="12" fill="#1e1e1e" text-anchor="middle">no salarial por defecto</text><text x="1610" y="503" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1940" y="172" font-size="14" fill="#343a40" text-anchor="middle">6 · PANEL ROI</text><text x="1940" y="241" font-size="12" fill="#1e1e1e" text-anchor="middle">COBERTURA</text><text x="1940" y="256" font-size="12" fill="#1e1e1e" text-anchor="middle">quién aplica qué</text><text x="1940" y="271" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1940" y="357" font-size="12" fill="#1e1e1e" text-anchor="middle">RIESGO DE DEPENDENCIA</text><text x="1940" y="372" font-size="12" fill="#1e1e1e" text-anchor="middle">crítica = 1 persona</text><text x="1940" y="387" font-size="12" fill="#1e1e1e" text-anchor="middle">(test)</text><text x="1940" y="473" font-size="12" fill="#1e1e1e" text-anchor="middle">COSTE FORMAR / TIEMPO</text><text x="1940" y="488" font-size="12" fill="#1e1e1e" text-anchor="middle">transferencia + tiempo</text><text x="1940" y="503" font-size="12" fill="#1e1e1e" text-anchor="middle">autonomía (test)</text><text x="2270" y="172" font-size="14" fill="#343a40" text-anchor="middle">7 · NEGOCIO &amp; FUNDAE</text><text x="2270" y="241" font-size="12" fill="#1e1e1e" text-anchor="middle">COBRO POR PLAN</text><text x="2270" y="256" font-size="12" fill="#1e1e1e" text-anchor="middle">diferido hasta</text><text x="2270" y="271" font-size="12" fill="#1e1e1e" text-anchor="middle">producto vendible</text><text x="2270" y="357" font-size="12" fill="#1e1e1e" text-anchor="middle">GARANTÍA DEL PILOTO</text><text x="2270" y="372" font-size="12" fill="#1e1e1e" text-anchor="middle">mensaje en la web</text><text x="2270" y="387" font-size="12" fill="#1e1e1e" text-anchor="middle">tracking pdte</text><text x="2270" y="473" font-size="12" fill="#1e1e1e" text-anchor="middle">FUNDAE</text><text x="2270" y="488" font-size="12" fill="#1e1e1e" text-anchor="middle">acción + control 75%</text><text x="2270" y="503" font-size="12" fill="#1e1e1e" text-anchor="middle">export (test)</text><text x="156" y="607" font-size="16" fill="#2f9e44" text-anchor="start">CONSTRUIDO Y VERIFICADO · platform/ (Fases 0-7)</text><text x="156" y="637" font-size="12" fill="#1e1e1e" text-anchor="start">• Multi-tenant: Postgres + Drizzle (26 tablas), aislamiento por empresa</text><text x="156" y="653" font-size="12" fill="#1e1e1e" text-anchor="start">• Auth + organización (better-auth): 1 usuario a multinacional</text><text x="156" y="668" font-size="12" fill="#1e1e1e" text-anchor="start">• RAG: embeddings + ingesta + recuperación por significado</text><text x="156" y="684" font-size="12" fill="#1e1e1e" text-anchor="start">• Agentes conversacionales por rol (LLM Anthropic; mock sin clave)</text><text x="156" y="700" font-size="12" fill="#1e1e1e" text-anchor="start">• Aprendizaje: onboarding, matrícula, test -&gt; Nivel 1</text><text x="156" y="715" font-size="12" fill="#1e1e1e" text-anchor="start">• Validación humana con rúbrica -&gt; Nivel 2 (no autoservicio)</text><text x="156" y="731" font-size="12" fill="#1e1e1e" text-anchor="start">• Propagación: coaching, puntos al aprobar, ascenso a Referente, antifraude</text><text x="156" y="746" font-size="12" fill="#1e1e1e" text-anchor="start">• Config + motor de reglas + certificados verificables (no salarial)</text><text x="156" y="762" font-size="12" fill="#1e1e1e" text-anchor="start">• Panel ROI: cobertura, riesgo, transferencia, tiempo a autonomía, línea base</text><text x="156" y="778" font-size="12" fill="#1e1e1e" text-anchor="start">• Gate de progreso (sin validar no se avanza) + FUNDAE (export bonificable)</text><text x="156" y="793" font-size="12" fill="#1e1e1e" text-anchor="start"></text><text x="156" y="809" font-size="12" fill="#1e1e1e" text-anchor="start">Verificado: typecheck 0 · 8 tests unit · 9 tests integración vs Postgres</text><text x="926" y="607" font-size="16" fill="#e03131" text-anchor="start">PENDIENTE / DIFERIDO</text><text x="926" y="637" font-size="12" fill="#1e1e1e" text-anchor="start">Config (no código):</text><text x="926" y="653" font-size="12" fill="#1e1e1e" text-anchor="start">• Clave Anthropic para respuestas reales de los agentes (ahora mock)</text><text x="926" y="668" font-size="12" fill="#1e1e1e" text-anchor="start">• Postgres en el VPS para desplegar (ahora corre en Postgres local)</text><text x="926" y="684" font-size="12" fill="#1e1e1e" text-anchor="start"></text><text x="926" y="700" font-size="12" fill="#1e1e1e" text-anchor="start">Amarillo (parcial):</text><text x="926" y="715" font-size="12" fill="#1e1e1e" text-anchor="start">• Generación IA de la ruta/lecciones enganchada al onboarding</text><text x="926" y="731" font-size="12" fill="#1e1e1e" text-anchor="start">• Gate de coste de IA ligado al presupuesto por alumno</text><text x="926" y="746" font-size="12" fill="#1e1e1e" text-anchor="start">• Tracking de la garantía del piloto</text><text x="926" y="762" font-size="12" fill="#1e1e1e" text-anchor="start"></text><text x="926" y="778" font-size="12" fill="#1e1e1e" text-anchor="start">Diferido:</text><text x="926" y="793" font-size="12" fill="#1e1e1e" text-anchor="start">• Cobro por plan / pagos (Fase 8, hasta que el producto se venda)</text><text x="926" y="809" font-size="12" fill="#1e1e1e" text-anchor="start">• Doble revisión N3 + auditoría por muestreo de la cascada</text><text x="926" y="825" font-size="12" fill="#1e1e1e" text-anchor="start">• Conectar los HTML actuales de SkillUp a la nueva API</text><text x="1696" y="608" font-size="17" fill="#1971c2" text-anchor="start">ESTRATEGIA DE ADOPCIÓN → ROI</text><text x="1696" y="640" font-size="13" fill="#1e1e1e" text-anchor="start">1. Entra por un equipo, no por toda la plantilla.</text><text x="1696" y="656" font-size="13" fill="#1e1e1e" text-anchor="start">2. Onboarding define por qué/para qué -&gt; ruta a su puesto.</text><text x="1696" y="672" font-size="13" fill="#1e1e1e" text-anchor="start">3. Aprende con lo suyo y DEMUESTRA en un caso real.</text><text x="1696" y="688" font-size="13" fill="#1e1e1e" text-anchor="start">4. El responsable valida -&gt; mete al mando en el bucle.</text><text x="1696" y="705" font-size="13" fill="#1e1e1e" text-anchor="start">5. El que domina forma al siguiente -&gt; el saber se queda y se multiplica.</text><text x="1696" y="721" font-size="13" fill="#1e1e1e" text-anchor="start">6. El panel convierte capacidad en ROI: cobertura, riesgo,</text><text x="1696" y="737" font-size="13" fill="#1e1e1e" text-anchor="start">    coste de formar, tiempo a autonomía.</text><text x="1696" y="753" font-size="13" fill="#1e1e1e" text-anchor="start">7. Garantía: si no ves la medición, no pagas.</text><text x="1696" y="770" font-size="13" fill="#1e1e1e" text-anchor="start">8. FUNDAE baja el coste; Boomatik se usa a sí misma = caso 0.</text><text x="1696" y="786" font-size="13" fill="#1e1e1e" text-anchor="start"></text><text x="1696" y="802" font-size="13" fill="#1e1e1e" text-anchor="start">Regla de voz: a la web solo salen RESULTADOS, nunca la mecánica.</text></svg></div></body>
