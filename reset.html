<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandooers · Nueva contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#714B67;--t:#017E84;--ink:#2D2D2D;--mut:#8F8F8F;--bg:#FAFAFA;--line:#E8E0E5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#4A4A4A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:radial-gradient(circle at 18% 12%,rgba(0,212,255,.06),transparent 42%),radial-gradient(circle at 84% 88%,rgba(236,72,153,.06),transparent 42%)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(113,75,103,.08)}
.brand{text-align:center;margin-bottom:14px}
.brandooers-logo{display:inline-flex;align-items:baseline;font-family:'Inter',sans-serif;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ink);user-select:none}
.brandooers-logo .beyes{display:inline-block;align-self:center;margin:0 1px}
.beyes .socketL,.beyes .socketR,.beyes .irisL,.beyes .irisR,.beyes .pupilL,.beyes .pupilR,.beyes .glint{transform-box:fill-box;transform-origin:center;animation:bBlink 5.2s infinite}
@keyframes bBlink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}98%{transform:scaleY(1)}}
h1{font-size:22px;font-weight:800;color:var(--ink);text-align:center}
.sub{font-family:'Caveat',cursive;font-size:20px;color:var(--t);margin-bottom:20px;text-align:center}
label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:14px 0 5px}
input{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
input:focus{outline:none;border-color:var(--p)}
button{width:100%;margin-top:22px;font-family:inherit;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--p);border:0;border-radius:10px;padding:13px;cursor:pointer}
button:disabled{opacity:.5}
.msg{font-size:13px;margin-top:14px;text-align:center;min-height:18px}
a{color:var(--p);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="bo-bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="bo-bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<radialGradient id="bo-iris1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
<radialGradient id="bo-iris2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
</defs></svg>
<form class="card" id="f">
  <div class="brand">
    <span class="brandooers-logo" style="font-size:28px">Brand<svg class="beyes" width="50" height="28" viewBox="0 0 100 58"><g transform="translate(5,0)"><ellipse class="socketL" cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#bo-bg1)" stroke-width="3"/><circle class="irisL" cx="20" cy="36" r="7.5" fill="url(#bo-iris1)"/><circle class="pupilL" cx="20" cy="36" r="3.5" fill="#0a0a0f"/><circle class="glint" cx="23" cy="33" r="2" fill="#fff"/></g><g transform="translate(53,0)"><ellipse class="socketR" cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#bo-bg2)" stroke-width="3"/><circle class="irisR" cx="20" cy="36" r="7.5" fill="url(#bo-iris2)"/><circle class="pupilR" cx="20" cy="36" r="3.5" fill="#0a0a0f"/><circle class="glint" cx="23" cy="33" r="2" fill="#fff"/></g></svg>ers</span>
  </div>
  <h1>Nueva contraseña</h1>
  <p class="sub" style="margin-top:2px">Elige tu contraseña</p>
  <label for="p1">Contraseña nueva (mín. 8)</label>
  <input id="p1" type="password" autocomplete="new-password" required>
  <label for="p2">Repite la contraseña</label>
  <input id="p2" type="password" autocomplete="new-password" required>
  <button id="b" type="submit">Guardar</button>
  <div class="msg" id="m"></div>
</form>
<script>
var token=new URLSearchParams(location.search).get('token')||'';
var m=document.getElementById('m'),b=document.getElementById('b');
if(!token){ m.style.color='#c92a2a'; m.textContent='Falta el enlace de recuperación.'; b.disabled=true; }
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault(); m.textContent='';
  var p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1!==p2){ m.style.color='#c92a2a'; m.textContent='Las contraseñas no coinciden'; return; }
  b.disabled=true;
  try{
    var r=await fetch('/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token,'new':p1})});
    var d=await r.json();
    if(r.ok&&d.ok){ m.style.color='#2b8a3e'; m.innerHTML='Contraseña actualizada. <a href="/login.html">Iniciar sesión</a>'; b.style.display='none'; return; }
    m.style.color='#c92a2a'; m.textContent=d.error||'No se pudo actualizar';
  }catch(_){ m.style.color='#c92a2a'; m.textContent='Error de conexión'; }
  b.disabled=false;
});
</script>
</body>
</html>
