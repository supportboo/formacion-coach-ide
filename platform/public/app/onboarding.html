<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Tu perfil</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/theme.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(circle at 15% 10%,rgba(63,216,224,.05),transparent 40%),radial-gradient(circle at 85% 90%,rgba(138,95,124,.05),transparent 40%)}
.card{width:100%;max-width:520px;padding:36px}
.logohead{display:flex;justify-content:center;margin-bottom:8px}
.kx{font-family:'Caveat',cursive;font-size:16px;color:var(--t);text-align:center;margin-bottom:18px}
h1{font-size:23px;color:var(--text);margin-bottom:6px;text-align:center;letter-spacing:-.02em}
p.sub{font-size:14px;color:var(--mut);margin-bottom:24px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logohead"><span class="blogo">Brand<svg class="beyes" width="38" height="22" viewBox="0 0 100 58"><defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="50%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>
    <radialGradient id="i1"><stop offset="0%" stop-color="#C69CB8"/><stop offset="100%" stop-color="#8a5f7c"/></radialGradient>
    <radialGradient id="i2"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="100%" stop-color="#1a9aa0"/></radialGradient>
    </defs>
    <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
    <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
  </svg>ers</span></div>
  <div class="kx">SkillUp</div>
  <h1>Cuéntanos de tu puesto</h1>
  <p class="sub">Esto ajusta tu ruta de aprendizaje a tu sector y a lo que necesitas de verdad.</p>
  <form id="f">
    <label>Sector</label><input id="sector" placeholder="p. ej. logística, retail, SaaS">
    <label>Puesto</label><input id="puesto" placeholder="p. ej. responsable de almacén">
    <label>¿Por qué / para qué quieres formarte ahora?</label>
    <textarea id="motivo" placeholder="Cuéntalo con tus palabras"></textarea>
    <button class="btn btn-grad btn-block" type="submit">Guardar y continuar</button>
    <div class="err msg" id="err"></div>
  </form>
  <div id="result" style="display:none">
    <div id="resultBody"></div>
    <button class="btn btn-grad btn-block" id="btnContinue" style="margin-top:16px">Ir a mi panel</button>
  </div>
</div>
<script src="/app/api.js"></script>
<script>
(async function () {
  var s = await SkillUp.requireSession();
  if (!s) return;
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var err = document.getElementById('err'); err.textContent = '';
    try {
      var res = await SkillUp.api('/api/learning/onboarding', { method: 'POST', body: {
        sector: document.getElementById('sector').value.trim() || undefined,
        puesto: document.getElementById('puesto').value.trim() || undefined,
        motivo: document.getElementById('motivo').value.trim() || undefined,
      } });
      var paths = (res && res.matchedPaths) || [];
      var body = document.getElementById('resultBody');
      if (paths.length > 0) {
        var names = paths.map(function (p) { return p.title; });
        body.innerHTML = '<h1>Ya tienes tu ruta</h1><p class="sub">Según lo que nos has contado, te hemos matriculado en:</p>'
          + '<ul style="text-align:left;margin:0 0 4px 18px;color:var(--text);font-size:14px">'
          + names.map(function (n) { return '<li>' + n.replace(/</g, '&lt;') + '</li>'; }).join('')
          + '</ul>';
      } else {
        body.innerHTML = '<h1>Perfil guardado</h1><p class="sub">Todavía no encontramos una ruta que encaje sola con tu sector o puesto — tu responsable te la asignará desde el panel de empresa.</p>';
      }
      document.getElementById('f').style.display = 'none';
      document.getElementById('result').style.display = '';
      document.getElementById('btnContinue').addEventListener('click', function () {
        window.location.href = '/app/inicio.html';
      });
    } catch (ex) { err.textContent = ex.message; }
  });
})();
</script>
</body>
</html>
