<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Aceptar invitación</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/theme.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);
  background-image:radial-gradient(circle at 15% 15%,rgba(0,212,255,.10),transparent 42%),radial-gradient(circle at 85% 85%,rgba(236,72,153,.10),transparent 42%)}
.card{width:100%;max-width:400px;padding:36px;background:var(--dark2);border:1px solid rgba(255,255,255,.08);color:var(--ink);text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.logohead{display:flex;justify-content:center;margin-bottom:22px}
.blogo{color:#fff;font-size:22px}
h1{font-size:19px;color:#fff;margin-bottom:6px}
p{font-size:14px;color:var(--ink-mut);margin-bottom:18px}
label{text-align:left;color:var(--ink-mut)}
input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}
input::placeholder{color:#6b6480}
.err{color:#fda4af;font-size:13px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logohead"><span class="blogo">Brand<svg class="beyes" width="38" height="22" viewBox="0 0 100 58"><defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="i1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
    <radialGradient id="i2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
    </defs>
    <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
    <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
  </svg>ers</span></div>
  <h1 id="title">Cargando invitación…</h1>
  <p id="sub"></p>
  <form id="f" style="display:none">
    <label>Email al que te invitaron</label><input id="email" type="email" required>
    <label>Tu nombre</label><input id="name" required>
    <label>Contraseña</label><input id="password" type="password" required minlength="8">
    <button class="btn btn-grad btn-block" id="submit" type="submit">Crear cuenta y unirme</button>
  </form>
  <button class="btn btn-grad btn-block" id="acceptBtn" style="display:none">Aceptar y entrar</button>
  <div class="err" id="err"></div>
</div>
<script src="/app/api.js"></script>
<script>
(async function () {
  var invId = new URLSearchParams(window.location.search).get('invitation');
  var title = document.getElementById('title'), sub = document.getElementById('sub'), err = document.getElementById('err');
  if (!invId) { title.textContent = 'Enlace no válido'; return; }

  var s = await SkillUp.session();
  if (!s || !s.user) {
    title.textContent = 'Te han invitado a SkillUp';
    sub.textContent = 'Crea tu cuenta con el mismo email al que te llegó la invitación.';
    document.getElementById('f').style.display = 'block';
    document.getElementById('f').addEventListener('submit', async function (e) {
      e.preventDefault();
      err.textContent = '';
      try {
        await SkillUp.api('/api/auth/sign-up/email', { method: 'POST', body: {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        } });
        window.location.reload();
      } catch (ex) { err.textContent = ex.message; }
    });
    return;
  }

  var inv;
  try { inv = await SkillUp.api('/api/auth/organization/get-invitation?id=' + encodeURIComponent(invId)); }
  catch (ex) { title.textContent = 'Invitación no encontrada'; sub.textContent = ex.message; return; }

  title.textContent = 'Únete a ' + SkillUp.escHtml(inv.organizationName || 'tu empresa');
  sub.textContent = 'Invitado por ' + SkillUp.escHtml(inv.inviterEmail || '') + '.';
  var btn = document.getElementById('acceptBtn'); btn.style.display = 'block';
  btn.addEventListener('click', async function () {
    err.textContent = '';
    try {
      await SkillUp.api('/api/auth/organization/accept-invitation', { method: 'POST', body: { invitationId: invId } });
      await SkillUp.api('/api/auth/organization/set-active', { method: 'POST', body: { organizationId: inv.organizationId } });
      window.location.href = '/app/onboarding.html';
    } catch (ex) { err.textContent = ex.message; }
  });
})();
</script>
</body>
</html>
