<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Validar casos</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/theme.css">
<style>
.who{font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:600}
.prompt{font-size:15px;color:var(--text);font-weight:700;margin-bottom:10px}
.sub{font-size:14px;background:var(--warm);border-radius:12px;padding:14px;margin-bottom:12px;white-space:pre-wrap;line-height:1.6}
.case-item{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.case-item:first-child{border-top:0;padding-top:0;margin-top:0}
.empty{color:var(--mut);font-size:14px}
.suggestion{margin:10px 0;padding:12px 14px;background:#F1EDFB;border-radius:12px;font-size:13px}
.suggestion .crit{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.suggestion .crit:not(:last-child){border-bottom:1px solid rgba(139,92,246,.15)}
.suggestion .score{font-weight:800;color:var(--p);flex-shrink:0}
.suggestion .note{color:var(--mut);font-size:12px;flex:1}
</style>
</head>
<body>
<div class="topbar">
  <span class="blogo">Brand<svg class="beyes" width="34" height="20" viewBox="0 0 100 58"><defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="i1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
    <radialGradient id="i2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
    </defs>
    <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
    <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
  </svg>ers<span class="sk">SkillUp</span></span>
  <nav><a href="/app/dashboard.html">← Mi panel</a></nav>
</div>
<div class="wrap">
  <div class="card"><h2>Casos pendientes de validar</h2><div id="list"></div></div>
</div>
<script src="/app/api.js"></script>
<script>
(async function () {
  var s = await SkillUp.requireSession(); if (!s) return;
  var list = document.getElementById('list');
  var cases;
  try { cases = await SkillUp.api('/api/validation/pending'); }
  catch (ex) { list.innerHTML = '<p class="empty">' + SkillUp.escHtml(ex.message) + '</p>'; return; }
  if (!cases.length) { list.innerHTML = '<p class="empty">No hay casos pendientes.</p>'; return; }
  cases.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'case-item';
    d.innerHTML =
      '<div class="who">Competencia ' + SkillUp.escHtml(c.competencyId) + ' · alumno ' + SkillUp.escHtml(c.userId) + '</div>' +
      '<div class="prompt">' + SkillUp.escHtml(c.prompt) + '</div>' +
      '<div class="sub">' + SkillUp.escHtml(c.submission || '') + '</div>' +
      '<button class="btn btn-gh" type="button">Ver sugerencia de IA por criterio</button>' +
      '<div class="suggestion" style="display:none"></div>' +
      '<textarea placeholder="Feedback (opcional)" style="margin-top:12px"></textarea>' +
      '<button class="btn btn-ok">Aprobar</button><button class="btn btn-danger" style="margin-left:8px">Rechazar</button>' +
      '<span class="msg" style="margin-left:10px"></span>';
    var ta = d.querySelector('textarea'), msg = d.querySelector('.msg');
    var suggestBtn = d.querySelector('.btn-gh'), suggestBox = d.querySelector('.suggestion');
    suggestBtn.addEventListener('click', async function () {
      suggestBtn.disabled = true; suggestBtn.textContent = 'Pensando…';
      try {
        var s2 = await SkillUp.api('/api/validation/cases/' + c.id + '/suggest');
        suggestBox.innerHTML = '<p style="margin-bottom:6px;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.02em">Sugerencia IA — no decide, solo apoya</p>' +
          s2.criteria.map(function (cr) {
            return '<div class="crit"><span>' + SkillUp.escHtml(cr.label) + '</span><span class="note">' + SkillUp.escHtml(cr.note) + '</span><span class="score">' + cr.score + '/10</span></div>';
          }).join('');
        suggestBox.style.display = 'block';
        suggestBtn.style.display = 'none';
      } catch (ex) {
        suggestBtn.disabled = false; suggestBtn.textContent = 'Ver sugerencia de IA por criterio';
        suggestBox.style.display = 'block'; suggestBox.innerHTML = '<span class="msg err">' + SkillUp.escHtml(ex.message) + '</span>';
      }
    });
    async function decide(decision) {
      try {
        var r = await SkillUp.api('/api/validation/cases/' + c.id + '/decide', { method: 'POST', body: { decision: decision, feedback: ta.value.trim() || undefined } });
        msg.textContent = 'Hecho — nivel actual del alumno: ' + r.level;
        d.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      } catch (ex) { msg.textContent = ex.message; }
    }
    d.querySelector('.btn-ok').addEventListener('click', function () { decide('aprobado'); });
    d.querySelector('.btn-danger').addEventListener('click', function () { decide('rechazado'); });
    list.appendChild(d);
  });
})();
</script>
</body>
</html>
