<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp · Repaso de 3 minutos</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/assess.css">
<style>
.when{color:var(--muted);font-size:13px;margin:0 0 6px}
.q{color:var(--ink);font-weight:700;font-size:16.5px;line-height:1.45;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px/1.4 Inter,system-ui,sans-serif;padding:10px 14px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:#3FD8E0}
.opts button.ok{border-color:#2E9E73;background:rgba(46,158,115,.14)}
.opts button.ko{border-color:#D0493F;background:rgba(208,73,63,.12)}
.exp{margin:12px 0 0;color:var(--body);font-size:14.5px}
.dots{display:flex;gap:6px;margin:0 0 12px}.dots i{width:28px;height:6px;border-radius:999px;background:var(--line)}.dots i.on{background:#3FD8E0}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:12px}
</style>
</head>
<body>
<div class="top"><span class="blogo">Brand<svg class="beyes" width="34" height="20" viewBox="0 0 100 58"><defs>     <linearGradient id="blg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="50%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>     <linearGradient id="blg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>     <radialGradient id="bli1"><stop offset="0%" stop-color="#C69CB8"/><stop offset="100%" stop-color="#8a5f7c"/></radialGradient>     <radialGradient id="bli2"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="100%" stop-color="#1a9aa0"/></radialGradient>     </defs>     <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#blg1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#bli1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>     <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#blg2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#bli2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>   </svg>ers<span class="sk">SkillUp</span></span><a class="back" href="/app/inicio.html">Volver</a></div>
<main class="wrap" id="wrap">
<h1 class="pt">Repaso de 3 minutos</h1>
<p class="lead">No repasas un módulo entero: repasas lo que fallaste de verdad, cuando ya ha pasado un tiempo. Es lo que más ayuda a no olvidarlo.</p>
<div id="box" aria-live="polite"><div class="card"><p class="muted" style="margin:0">Buscando tus errores…</p></div></div>
</main>
<script src="/app/i18n.js"></script>
<script src="/app/api.js"></script>
<script src="/app/nav.js" defer></script>
<script>
(function(){
"use strict";
try{ if(localStorage.getItem('skillup-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
function e(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var box=document.getElementById('box'), S=null, k=0, ok=0;
function ago(iso){ var d=Math.floor((Date.now()-new Date(iso).getTime())/86400000); return d<=1?'hace un día':'hace '+d+' días'; }
function dots(){ return '<div class="dots">'+S.items.map(function(_,i){ return '<i class="'+(i<=k?'on':'')+'"></i>'; }).join('')+'</div>'; }
function show(){
  var it=S.items[k];
  box.innerHTML='<div class="card">'+dots()+'<p class="when">'+e(ago(it.failedAt))+' fallaste esto en el test del bloque '+(it.block>=0?it.block+1:'final')+' de «'+e(it.courseTitle)+'».</p><p class="q">'+e(it.q)+'</p><div class="opts">'
    +it.options.map(function(o,j){ return '<button type="button" data-j="'+j+'">'+e(o)+'</button>'; }).join('')+'</div><div id="after"></div></div>';
  box.querySelectorAll('[data-j]').forEach(function(b){ b.onclick=async function(){
    box.querySelectorAll('[data-j]').forEach(function(x){ x.disabled=true; });
    try{ var r=await SkillUp.api('/api/learning/review/answer',{method:'POST',body:{id:S.id,i:it.i,choice:+b.dataset.j}});
      if(r.correct) ok++;
      box.querySelector('[data-j="'+r.correctIndex+'"]').classList.add('ok'); if(!r.correct) b.classList.add('ko');
      document.getElementById('after').innerHTML='<p class="exp"><b style="color:var(--ink)">'+(r.correct?'Bien. ':'Esta era la buena. ')+'</b>'+e(r.explain)+'</p><button class="btn" id="nx" type="button" style="margin-top:12px">'+(k<S.items.length-1?'SIGUIENTE':'ÚLTIMO PASO')+'</button>';
      document.getElementById('nx').onclick=function(){ k++; if(k<S.items.length) show(); else apply(); };
    }catch(ex){ document.getElementById('after').innerHTML='<p class="exp">'+e(ex.message||'No se ha podido corregir.')+'</p>'; } }; });
}
function apply(){
  var it=S.items[0];
  box.innerHTML='<div class="card"><p class="when">'+ok+' de '+S.items.length+' bien. Lo que aciertas dos veces, con una semana de margen, deja de salir.</p><p class="q">Último paso: ¿dónde vas a usar esto esta semana?</p><p class="muted" style="margin:0 0 10px">Piensa en «'+e(it.q)+'» y en una situación concreta de tu trabajo.</p>'
    +'<label for="ap" class="muted" style="font-size:13px">Tu situación (opcional)</label><textarea id="ap" maxlength="240" placeholder="Por ejemplo: en la llamada del jueves con el distribuidor de Valencia"></textarea>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="sv" type="button">GUARDAR Y TERMINAR</button><a class="btn" style="background:transparent;border:1px solid var(--line);color:var(--ink)" href="/app/inicio.html">TERMINAR</a></div><p class="muted" id="m" style="margin:8px 0 0"></p></div>';
  document.getElementById('sv').onclick=async function(){ var v=document.getElementById('ap').value.trim(); if(!v){ location.href='/app/inicio.html'; return; }
    this.disabled=true; try{ await SkillUp.api('/api/learning/facts',{method:'POST',body:{layer:'aplicacion',text:('Aplicaré «'+it.q.slice(0,80)+'» en: '+v).slice(0,240)}}); location.href='/app/inicio.html'; }
    catch(ex){ document.getElementById('m').textContent=ex.message||'No se ha podido guardar.'; this.disabled=false; } };
}
SkillUp.api('/api/learning/review').then(function(d){ S=d;
  if(!d.id){ box.innerHTML='<div class="card"><p style="margin:0">Hoy no tienes nada que repasar. Aquí aparecerán las preguntas que falles en los tests, un par de días después.</p><a class="btn" href="/app/inicio.html" style="margin-top:12px">VOLVER</a></div>'; return; }
  show();
}).catch(function(ex){ box.innerHTML='<div class="card"><p style="margin:0">'+e(ex.message||'No se ha podido cargar.')+'</p></div>'; });
})();
</script>
</body>
</html>
