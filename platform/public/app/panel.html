<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Panel de empresa</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/theme.css">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--warm);border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px;color:var(--p);letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.inline-input{display:inline-block;width:auto;min-width:180px;margin:0 8px 8px 0}
details summary{cursor:pointer;font-size:14px;color:var(--p);font-weight:700;margin-bottom:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ ";display:inline-block}
details[open] summary:before{content:"▾ "}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--body);margin-bottom:8px}
.chk input{width:auto;margin:0}
</style>
</head>
<body>
<div class="topbar">
  <span class="blogo">Brand<svg class="beyes" width="34" height="20" viewBox="0 0 100 58"><defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="i1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
    <radialGradient id="i2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
    </defs>
    <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
    <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
  </svg>ers<span class="sk">Panel de empresa</span></span>
  <nav><a href="/app/dashboard.html">← Mi panel</a></nav>
</div>
<div class="wrap">

  <div class="card">
    <h2>Facturación</h2>
    <div id="subInfo" class="msg">Cargando…</div>
    <div id="tiersBox" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>ROI <span class="hand" style="color:var(--t);font-size:15px">línea base vs. hoy</span></h2>
    <div class="grid" id="stats"></div>
    <h2 style="margin-top:20px">Cobertura por competencia</h2>
    <div id="coverage"></div>
    <h2 style="margin-top:20px">Riesgo de dependencia</h2>
    <div id="risks"></div>
    <button class="btn btn-gh" id="btnBaseline" style="margin-top:10px">Capturar línea base ahora</button>
    <div class="msg" id="baselineMsg"></div>
  </div>

  <div class="card">
    <details>
      <summary>Catálogo (sectores, puestos, competencias, rutas)</summary>
      <input class="inline-input" id="sectorName" placeholder="Nuevo sector"><button class="btn btn-gh" id="btnSector">Crear</button>
      <div id="sectorMsg" class="msg"></div>
      <input class="inline-input" id="puestoName" placeholder="Nuevo puesto"><input class="inline-input" id="puestoSector" placeholder="ID sector (opcional)">
      <button class="btn btn-gh" id="btnPuesto">Crear</button><div id="puestoMsg" class="msg"></div>
      <input class="inline-input" id="compName" placeholder="Nueva competencia"><input class="inline-input" id="compPuesto" placeholder="ID puesto (opcional)">
      <label class="chk"><input type="checkbox" id="compCritical"> crítica</label><br>
      <button class="btn btn-gh" id="btnComp">Crear</button><div id="compMsg" class="msg"></div>
      <input class="inline-input" id="pathTitle" placeholder="Nueva ruta"><input class="inline-input" id="pathComp" placeholder="ID competencia (opcional)">
      <button class="btn btn-gh" id="btnPath">Crear</button><div id="pathMsg" class="msg"></div>
    </details>
  </div>

  <div class="card">
    <h2>Equipo</h2>
    <input class="inline-input" id="inviteEmail" type="email" placeholder="Email a invitar"><button class="btn btn-grad" id="btnInvite">Invitar</button>
    <div id="inviteMsg" class="msg"></div>
    <div id="team" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <details>
      <summary>Motor de recompensas</summary>
      <input class="inline-input" id="ruleEvent" placeholder="evento (n2 | referente | cobertura)">
      <input class="inline-input" id="ruleReward" placeholder="recompensa (certificado|titulo|punto|perk|senal_rrhh)">
      <button class="btn btn-gh" id="btnRule">Crear regla</button><div id="ruleMsg" class="msg"></div>
    </details>
  </div>

</div>
<script src="/app/api.js"></script>
<script>
(async function () {
  var s = await SkillUp.requireSession(); if (!s) return;

  async function loadBilling() {
    var sub = await SkillUp.api('/api/billing/subscription').catch(function () { return null; });
    var info = document.getElementById('subInfo');
    info.textContent = sub ? ('Plan actual: ' + sub.tier + ' · ' + sub.seats + ' asientos · estado: ' + sub.status)
      : 'Sin suscripción activa todavía.';
    var tiers = await SkillUp.api('/api/billing/tiers').catch(function () { return []; });
    document.getElementById('tiersBox').innerHTML = tiers.map(function (t) {
      return '<div class="row"><span>' + SkillUp.escHtml(t.label) + ' — ' + (t.pricePerSeatCents / 100).toFixed(2) + ' €/asiento/mes</span>' +
        '<button class="btn btn-grad" data-tier="' + t.tier + '">Suscribir</button></div>';
    }).join('');
    document.querySelectorAll('#tiersBox button').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        try {
          var r = await SkillUp.api('/api/billing/checkout', { method: 'POST', body: { tier: btn.dataset.tier } });
          window.location.href = r.url;
        } catch (ex) { alert(ex.message); }
      });
    });
  }
  loadBilling();

  async function loadPanel() {
    var p = await SkillUp.api('/api/analytics/panel').catch(function (e) { return null; });
    if (!p) return;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + (p.internalTransfer * 100).toFixed(0) + '%</b><span>formado de casa</span></div>' +
      '<div class="stat"><b>' + p.timeToAutonomyDays + '</b><span>días a autonomía</span></div>';
    document.getElementById('coverage').innerHTML = p.coverage.map(function (c) {
      return '<div class="row"><span>' + SkillUp.escHtml(c.name) + (c.critical ? ' ⚠' : '') + '</span><span>' + c.atApply + '/' + c.total + ' (' + c.pct + '%)</span></div>';
    }).join('') || '<p class="msg">Aún sin competencias configuradas.</p>';
    document.getElementById('risks').innerHTML = p.risks.map(function (r) {
      return '<div class="row"><span class="risk">' + SkillUp.escHtml(r.name) + '</span><span>' + r.referentes + ' referente(s)</span></div>';
    }).join('') || '<p class="msg">Sin riesgos de dependencia detectados.</p>';
  }
  loadPanel();

  document.getElementById('btnBaseline').addEventListener('click', async function () {
    var m = document.getElementById('baselineMsg');
    try { await SkillUp.api('/api/analytics/baseline', { method: 'POST' }); m.textContent = 'Línea base capturada.'; }
    catch (ex) { m.textContent = ex.message; }
  });

  function wireCreate(btnId, msgId, path, buildBody) {
    document.getElementById(btnId).addEventListener('click', async function () {
      var m = document.getElementById(msgId);
      try { await SkillUp.api(path, { method: 'POST', body: buildBody() }); m.textContent = 'Creado.'; }
      catch (ex) { m.textContent = ex.message; }
    });
  }
  wireCreate('btnSector', 'sectorMsg', '/api/catalog/sectors', function () {
    return { name: document.getElementById('sectorName').value.trim() };
  });
  wireCreate('btnPuesto', 'puestoMsg', '/api/catalog/puestos', function () {
    return { name: document.getElementById('puestoName').value.trim(), sectorId: document.getElementById('puestoSector').value.trim() || undefined };
  });
  wireCreate('btnComp', 'compMsg', '/api/catalog/competencies', function () {
    return { name: document.getElementById('compName').value.trim(), puestoId: document.getElementById('compPuesto').value.trim() || undefined, critical: document.getElementById('compCritical').checked };
  });
  wireCreate('btnPath', 'pathMsg', '/api/catalog/paths', function () {
    return { title: document.getElementById('pathTitle').value.trim(), competencyId: document.getElementById('pathComp').value.trim() || undefined };
  });
  wireCreate('btnRule', 'ruleMsg', '/api/config/reward-rules', function () {
    return { event: document.getElementById('ruleEvent').value.trim(), reward: document.getElementById('ruleReward').value.trim() };
  });

  var ROLES = ['empleado', 'coach', 'team_leader', 'inspirador', 'admin', 'direccion'];
  var orgId = s.session.activeOrganizationId;

  document.getElementById('btnInvite').addEventListener('click', async function () {
    var m = document.getElementById('inviteMsg');
    var email = document.getElementById('inviteEmail').value.trim();
    if (!email) return;
    try {
      // better-auth solo conoce sus propios roles al invitar; el rol real se fija después de aceptar.
      await SkillUp.api('/api/auth/organization/invite-member', { method: 'POST', body: { email: email, role: 'member', organizationId: orgId } });
      m.textContent = 'Invitación enviada. Cuando la acepte, asígnale su rol abajo.';
      document.getElementById('inviteEmail').value = '';
    } catch (ex) { m.textContent = ex.message; }
  });

  async function renderTeam() {
    var team = await SkillUp.api('/api/org/team').catch(function () { return []; });
    document.getElementById('team').innerHTML = team.map(function (m) {
      var opts = ROLES.map(function (r) { return '<option value="' + r + '"' + (r === m.role ? ' selected' : '') + '>' + r + '</option>'; }).join('');
      return '<div class="row"><span>' + SkillUp.escHtml(m.name) + ' · ' + SkillUp.escHtml(m.email) + '</span>' +
        '<span style="display:flex;align-items:center;gap:10px"><select data-u="' + m.userId + '" class="roleSel" style="margin:0;width:auto">' + opts + '</select>' +
        ' <a href="#" data-u="' + m.userId + '" class="erase" style="color:var(--red);font-size:12.5px">borrar (RGPD)</a></span></div>';
    }).join('') || '<p class="msg">Sin miembros todavía.</p>';

    document.querySelectorAll('.roleSel').forEach(function (sel) {
      sel.addEventListener('change', async function () {
        try { await SkillUp.api('/api/org/members/' + sel.dataset.u + '/role', { method: 'PUT', body: { role: sel.value } }); }
        catch (ex) { alert(ex.message); }
      });
    });
    document.querySelectorAll('.erase').forEach(function (a) {
      a.addEventListener('click', async function (e) {
        e.preventDefault();
        if (!confirm('¿Borrar datos personales de este miembro? No se puede deshacer.')) return;
        await SkillUp.api('/api/privacy/users/' + a.dataset.u + '/erase', { method: 'POST' });
        renderTeam();
      });
    });
  }
  renderTeam();
})();
</script>
</body>
</html>
