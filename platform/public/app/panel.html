<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Panel de empresa</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8B5CF6;--ink:#0E0B14;--body:#4A4A4A;--mut:#8F8F8F;--bg:#FAFAFA;--line:#E8E0E5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--body)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:#fff}
.top a{font-size:13px;color:var(--mut);text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{font-size:15px;color:var(--ink);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.stat{background:#FAFAFA;border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--p)}
.stat span{font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F3EEF1;font-size:13.5px}
.row:last-child{border-bottom:0}
input{font:inherit;font-size:13.5px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;margin:0 6px 8px 0}
.btn{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:100px;padding:9px 16px;cursor:pointer;background:var(--p);color:#fff}
.btn.danger{background:#DC2626}
.msg{font-size:12.5px;color:var(--mut);margin-top:6px}
.risk{color:#DC2626;font-weight:700}
details summary{cursor:pointer;font-size:13px;color:var(--p);font-weight:600;margin-bottom:10px}
</style>
</head>
<body>
<div class="top"><strong>SkillUp · Panel de empresa</strong><a href="/app/dashboard.html">← Mi panel</a></div>
<div class="wrap">

  <div class="card">
    <h2>Facturación</h2>
    <div id="subInfo" class="msg">Cargando…</div>
    <div id="tiersBox" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>ROI (línea base vs. hoy)</h2>
    <div class="grid" id="stats"></div>
    <h2 style="margin-top:16px">Cobertura por competencia</h2>
    <div id="coverage"></div>
    <h2 style="margin-top:16px">Riesgo de dependencia</h2>
    <div id="risks"></div>
    <button class="btn" id="btnBaseline">Capturar línea base ahora</button>
    <div class="msg" id="baselineMsg"></div>
  </div>

  <div class="card">
    <details>
      <summary>Catálogo (sectores, puestos, competencias, rutas)</summary>
      <input id="sectorName" placeholder="Nuevo sector"><button class="btn" id="btnSector">Crear</button>
      <div id="sectorMsg" class="msg"></div>
      <input id="puestoName" placeholder="Nuevo puesto"><input id="puestoSector" placeholder="ID sector (opcional)">
      <button class="btn" id="btnPuesto">Crear</button><div id="puestoMsg" class="msg"></div>
      <input id="compName" placeholder="Nueva competencia"><input id="compPuesto" placeholder="ID puesto (opcional)">
      <label style="font-size:13px"><input type="checkbox" id="compCritical" style="width:auto;display:inline"> crítica</label>
      <button class="btn" id="btnComp">Crear</button><div id="compMsg" class="msg"></div>
      <input id="pathTitle" placeholder="Nueva ruta"><input id="pathComp" placeholder="ID competencia (opcional)">
      <button class="btn" id="btnPath">Crear</button><div id="pathMsg" class="msg"></div>
    </details>
  </div>

  <div class="card">
    <h2>Equipo</h2>
    <input id="inviteEmail" type="email" placeholder="Email a invitar"><button class="btn" id="btnInvite">Invitar</button>
    <div id="inviteMsg" class="msg"></div>
    <div id="team" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <details>
      <summary>Motor de recompensas</summary>
      <input id="ruleEvent" placeholder="evento (n2 | referente | cobertura)">
      <input id="ruleReward" placeholder="recompensa (certificado|titulo|punto|perk|senal_rrhh)">
      <button class="btn" id="btnRule">Crear regla</button><div id="ruleMsg" class="msg"></div>
    </details>
  </div>

</div>
<script src="/app/api.js"></script>
<script>
(async function () {
  var s = await SkillUp.requireSession(); if (!s) return;

  async function loadBilling() {
    var sub = await SkillUp.api('/api/billing/subscription').catch(function () { return null; });
    var info = document.getElementById('subInfo');
    info.textContent = sub ? ('Plan actual: ' + sub.tier + ' · ' + sub.seats + ' asientos · estado: ' + sub.status)
      : 'Sin suscripción activa todavía.';
    var tiers = await SkillUp.api('/api/billing/tiers').catch(function () { return []; });
    document.getElementById('tiersBox').innerHTML = tiers.map(function (t) {
      return '<div class="row"><span>' + SkillUp.escHtml(t.label) + ' — ' + (t.pricePerSeatCents / 100).toFixed(2) + ' €/asiento/mes</span>' +
        '<button class="btn" data-tier="' + t.tier + '">Suscribir</button></span></div>';
    }).join('');
    document.querySelectorAll('#tiersBox button').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        try {
          var r = await SkillUp.api('/api/billing/checkout', { method: 'POST', body: { tier: btn.dataset.tier } });
          window.location.href = r.url;
        } catch (ex) { alert(ex.message); }
      });
    });
  }
  loadBilling();

  async function loadPanel() {
    var p = await SkillUp.api('/api/analytics/panel').catch(function (e) { return null; });
    if (!p) return;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + (p.internalTransfer * 100).toFixed(0) + '%</b><span>formado de casa</span></div>' +
      '<div class="stat"><b>' + p.timeToAutonomyDays + '</b><span>días a autonomía</span></div>';
    document.getElementById('coverage').innerHTML = p.coverage.map(function (c) {
      return '<div class="row"><span>' + SkillUp.escHtml(c.name) + (c.critical ? ' ⚠' : '') + '</span><span>' + c.atApply + '/' + c.total + ' (' + c.pct + '%)</span></div>';
    }).join('') || '<p class="msg">Aún sin competencias configuradas.</p>';
    document.getElementById('risks').innerHTML = p.risks.map(function (r) {
      return '<div class="row"><span class="risk">' + SkillUp.escHtml(r.name) + '</span><span>' + r.referentes + ' referente(s)</span></div>';
    }).join('') || '<p class="msg">Sin riesgos de dependencia detectados.</p>';
  }
  loadPanel();

  document.getElementById('btnBaseline').addEventListener('click', async function () {
    var m = document.getElementById('baselineMsg');
    try { await SkillUp.api('/api/analytics/baseline', { method: 'POST' }); m.textContent = 'Línea base capturada.'; }
    catch (ex) { m.textContent = ex.message; }
  });

  function wireCreate(btnId, msgId, path, buildBody) {
    document.getElementById(btnId).addEventListener('click', async function () {
      var m = document.getElementById(msgId);
      try { await SkillUp.api(path, { method: 'POST', body: buildBody() }); m.textContent = 'Creado.'; }
      catch (ex) { m.textContent = ex.message; }
    });
  }
  wireCreate('btnSector', 'sectorMsg', '/api/catalog/sectors', function () {
    return { name: document.getElementById('sectorName').value.trim() };
  });
  wireCreate('btnPuesto', 'puestoMsg', '/api/catalog/puestos', function () {
    return { name: document.getElementById('puestoName').value.trim(), sectorId: document.getElementById('puestoSector').value.trim() || undefined };
  });
  wireCreate('btnComp', 'compMsg', '/api/catalog/competencies', function () {
    return { name: document.getElementById('compName').value.trim(), puestoId: document.getElementById('compPuesto').value.trim() || undefined, critical: document.getElementById('compCritical').checked };
  });
  wireCreate('btnPath', 'pathMsg', '/api/catalog/paths', function () {
    return { title: document.getElementById('pathTitle').value.trim(), competencyId: document.getElementById('pathComp').value.trim() || undefined };
  });
  wireCreate('btnRule', 'ruleMsg', '/api/config/reward-rules', function () {
    return { event: document.getElementById('ruleEvent').value.trim(), reward: document.getElementById('ruleReward').value.trim() };
  });

  var ROLES = ['empleado', 'coach', 'team_leader', 'inspirador', 'admin', 'direccion'];
  var orgId = s.session.activeOrganizationId;

  document.getElementById('btnInvite').addEventListener('click', async function () {
    var m = document.getElementById('inviteMsg');
    var email = document.getElementById('inviteEmail').value.trim();
    if (!email) return;
    try {
      // better-auth solo conoce sus propios roles al invitar; el rol real se fija después de aceptar.
      await SkillUp.api('/api/auth/organization/invite-member', { method: 'POST', body: { email: email, role: 'member', organizationId: orgId } });
      m.textContent = 'Invitación enviada. Cuando la acepte, asígnale su rol abajo.';
      document.getElementById('inviteEmail').value = '';
    } catch (ex) { m.textContent = ex.message; }
  });

  async function renderTeam() {
    var team = await SkillUp.api('/api/org/team').catch(function () { return []; });
    document.getElementById('team').innerHTML = team.map(function (m) {
      var opts = ROLES.map(function (r) { return '<option value="' + r + '"' + (r === m.role ? ' selected' : '') + '>' + r + '</option>'; }).join('');
      return '<div class="row"><span>' + SkillUp.escHtml(m.name) + ' · ' + SkillUp.escHtml(m.email) + '</span>' +
        '<span><select data-u="' + m.userId + '" class="roleSel">' + opts + '</select>' +
        ' <a href="#" data-u="' + m.userId + '" class="erase" style="color:#DC2626">borrar (RGPD)</a></span></div>';
    }).join('') || '<p class="msg">Sin miembros todavía.</p>';

    document.querySelectorAll('.roleSel').forEach(function (sel) {
      sel.addEventListener('change', async function () {
        try { await SkillUp.api('/api/org/members/' + sel.dataset.u + '/role', { method: 'PUT', body: { role: sel.value } }); }
        catch (ex) { alert(ex.message); }
      });
    });
    document.querySelectorAll('.erase').forEach(function (a) {
      a.addEventListener('click', async function (e) {
        e.preventDefault();
        if (!confirm('¿Borrar datos personales de este miembro? No se puede deshacer.')) return;
        await SkillUp.api('/api/privacy/users/' + a.dataset.u + '/erase', { method: 'POST' });
        renderTeam();
      });
    });
  }
  renderTeam();
})();
</script>
</body>
</html>
