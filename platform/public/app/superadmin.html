<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp · Consola Superadmin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/theme.css">
<style>
body{display:flex;min-height:100dvh}
/* Barra lateral estructurada */
.side{width:236px;flex:none;position:sticky;top:0;align-self:flex-start;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:16px 12px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:2px;font-weight:900;font-size:18px;color:var(--ink);padding:6px 8px 12px}
.side .brand .sk{font-family:var(--fc);color:var(--teal2);font-size:15px;margin-left:6px}
.side .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:700}
.navb{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;color:var(--body);font-size:14px;font-weight:600;cursor:pointer;border:0;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
.navb:hover{background:var(--soft);color:var(--ink)}
.navb.on{background:linear-gradient(120deg,rgba(26,154,160,.22),rgba(138,95,124,.22));color:var(--ink)}
.navb svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
/* Contenido */
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1080px}
.sec{display:none}.sec.on{display:block;animation:fade .25s both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.h h1{font-family:var(--fh);font-size:26px;color:var(--ink);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;max-width:640px}
/* Tooltip */
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800;cursor:help;margin-left:6px;position:relative;vertical-align:middle}
.tip:hover::after{content:attr(data-tip);position:absolute;left:50%;top:130%;transform:translateX(-50%);width:240px;background:#0f0d15;color:#EDE9F3;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;font-weight:500;line-height:1.45;z-index:40;box-shadow:0 14px 40px rgba(0,0,0,.5)}
/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.tile .v{font-family:var(--fh);font-size:26px;font-weight:800;color:var(--ink)}
.tile .l{font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tile .v.teal{color:var(--teal2)}.tile .v.gold{color:var(--gold)}.tile .v.aub{color:var(--aub2)}
/* Tabla */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--body);vertical-align:middle}
.tbl tr:hover td{background:var(--soft)}
.tbl select{margin:0;padding:6px 8px;font-size:12.5px;width:auto;min-width:130px}
.bar{height:7px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--aub2))}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;background:var(--soft);color:var(--aub2)}
.pill.sa{background:rgba(240,198,69,.16);color:var(--gold)}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}.main{padding:20px 16px 60px}}
@media(max-width:760px){body{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.side .grp,.side .brand{width:100%}.side .foot{margin:0}}
details.ag{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
details.ag summary{cursor:pointer;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.ag pre{white-space:pre-wrap;font-size:12.5px;color:var(--body);margin-top:10px;font-family:var(--ff);line-height:1.55;background:var(--soft);padding:12px;border-radius:10px}
.mono{font-size:12px;color:var(--muted)}
.mic{width:42px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--teal2);cursor:pointer;display:grid;place-items:center;height:44px}
.mic.rec{background:#e74c3c;color:#fff;border-color:#e74c3c}
.rowflex{display:flex;gap:8px;align-items:flex-start}
.ok{color:var(--green);font-size:13px}.err{color:var(--red);font-size:13px}
.note{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--body);line-height:1.55}
.k{font-family:var(--fc);color:var(--teal2);font-size:15px}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumb a{color:var(--teal2);cursor:pointer}.crumb .sep{color:var(--muted)}
.linkname{color:var(--ink);cursor:pointer;border-bottom:1px dashed var(--line)}
.linkname:hover{color:var(--teal2);border-color:var(--teal2)}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">Brand<svg width="30" height="18" viewBox="0 0 100 58"><g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#3FD8E0" stroke-width="4"/><circle cx="20" cy="36" r="8" fill="#C69CB8"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g><g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#F0C645" stroke-width="4"/><circle cx="20" cy="36" r="8" fill="#3FD8E0"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g></svg>ers<span class="sk">Consola</span></div>
  <div class="grp">Visión</div>
  <button class="navb on" data-sec="resumen"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Resumen</button>
  <button class="navb" data-sec="empresas"><svg viewBox="0 0 24 24"><path d="M3 21h18M6 21V7l6-4 6 4v14"/><path d="M10 9h.01M14 9h.01M10 13h.01M14 13h.01"/></svg>Empresas</button>
  <button class="navb" data-sec="insights"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><circle cx="9" cy="12" r="1.5"/><circle cx="14" cy="8" r="1.5"/><circle cx="19" cy="13" r="1.5"/><path d="M9 12l5-4 5 5"/></svg>Insights</button>
  <button class="navb" data-sec="metricas"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>Métricas</button>
  <div class="grp">Personas</div>
  <button class="navb" data-sec="usuarios"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 4-6 7-6s7 2 7 6"/><path d="M17 11l2 2 4-4"/></svg>Usuarios y roles</button>
  <button class="navb" data-sec="perfiles"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>Perfiles de prueba</button>
  <div class="grp">Inteligencia</div>
  <button class="navb" data-sec="agentes"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M8 2h8"/><circle cx="9" cy="14" r="1.3"/><circle cx="15" cy="14" r="1.3"/></svg>Agentes tutores</button>
  <button class="navb" data-sec="conocimiento"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h7M8 11h7"/></svg>Conocimiento</button>
  <button class="navb" data-sec="retos"><svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><path d="M6 3H4m14 0h2M9 21h6M12 15v6"/></svg>Retos y práctica</button>
  <div class="grp">Sistema</div>
  <button class="navb" data-sec="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 2h-4l-.4 2.9a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.9h4l.4-2.9a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z"/></svg>Ajustes</button>
  <div class="foot">
    <button class="navb" onclick="location.href='/app/inicio.html?app=1'"><svg viewBox="0 0 24 24"><path d="M4 12h16M4 12l6-6M4 12l6 6"/></svg>Ir a Formación</button>
    <button class="navb" id="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Salir</button>
  </div>
</aside>
<main class="main" id="main"><div class="note" style="margin-top:40px">Comprobando acceso de superadmin…</div></main>
<script src="/app/api.js"></script>
<script>
(function(){
"use strict";
try{ if(localStorage.getItem('skillup-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
var E=SkillUp.escHtml, main=document.getElementById('main');
var DATA={}; // caché por sección
function money(n){ return (Number(n)||0).toFixed(4)+' $'; }
function pct(n){ return Math.round(Number(n)||0)+'%'; }
function tip(t){ return '<span class="tip" data-tip="'+E(t)+'">i</span>'; }
function hdr(title,tt,sub){ return '<div class="h"><h1>'+E(title)+tip(tt)+'</h1></div><p class="sub">'+E(sub)+'</p>'; }

/* ---------- RESUMEN ---------- */
async function resumen(box){
  box.innerHTML=hdr('Resumen','Foto rápida de toda la plataforma: empresas, usuarios y coste real de IA (nunca estimado).','Cómo va todo, de un vistazo. Los datos son en vivo de todas las empresas cliente.')
    +'<div class="tiles" id="tiles"><div class="note">Cargando…</div></div>'
    +'<div class="two"><div class="card"><h2>Evolución de riesgos críticos '+tip('Suma de competencias críticas sin cobertura en todas las empresas, día a día. Baja = mejor.')+'</h2><div id="chart"><p class="msg">Cargando…</p></div></div>'
    +'<div class="card"><h2>Pregunta al orquestador '+tip('Un agente que responde SOLO con los datos reales de todas las empresas. No ejecuta acciones.')+'</h2><div id="orq"></div></div></div>';
  var summary=await SkillUp.api('/api/platform/summary').catch(function(){return [];});
  var cost=await SkillUp.api('/api/platform/cost?days=30').catch(function(){return {total:{usd:0},orchestrator:{usd:0}};});
  var users=await SkillUp.api('/api/platform/users').catch(function(){return {users:[]};});
  DATA.summary=summary; DATA.users=(users&&users.users)||[];
  var nUsers=new Set(DATA.users.map(function(u){return u.userId;})).size;
  var totUsd=cost&&cost.total?(cost.total.usd!=null?cost.total.usd:cost.total):0;
  var orqUsd=cost&&cost.orchestrator?(cost.orchestrator.usd!=null?cost.orchestrator.usd:cost.orchestrator):0;
  document.getElementById('tiles').innerHTML=
     tile(Array.isArray(summary)?summary.length:0,'Empresas','teal')
    +tile(nUsers,'Usuarios','aub')
    +tile(money(totUsd),'Coste IA · 30 días','gold')
    +tile(money(orqUsd),'Solo orquestador','');
  var hist=await SkillUp.api('/api/platform/history?days=90').catch(function(){return [];});
  var pts=(Array.isArray(hist)?hist:[]).map(function(h){return {day:h.day,r:h.criticalRisks!=null?h.criticalRisks:(h.critical_risks||0)};});
  document.getElementById('chart').innerHTML=SkillUp.lineChart(pts,'r',{color:'#3FD8E0',label:'Riesgos críticos',format:function(v){return String(v);}});
  wireOrq(document.getElementById('orq'));
}
function tile(v,l,cls){ return '<div class="tile"><div class="v '+(cls||'')+'">'+E(String(v))+'</div><div class="l">'+E(l)+'</div></div>'; }
function wireOrq(box){
  box.innerHTML='<div id="olog" style="display:flex;flex-direction:column;gap:8px;max-height:200px;overflow:auto;margin-bottom:10px"></div><div class="rowflex"><input id="oin" placeholder="Ej: ¿qué empresa tiene más riesgo?" style="margin:0"><button class="btn btn-grad" id="oask" style="flex:none">Preguntar</button></div>';
  var log=document.getElementById('olog'),inp=document.getElementById('oin');
  function bub(role,txt){var d=document.createElement('div');d.style.cssText='padding:9px 12px;border-radius:12px;font-size:13px;max-width:90%;'+(role==='u'?'align-self:flex-end;background:linear-gradient(120deg,var(--teal),var(--aub));color:#fff':'align-self:flex-start;background:var(--soft);border:1px solid var(--line)');d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
  async function ask(){var t=inp.value.trim();if(!t)return;inp.value='';bub('u',t);var th=bub('a','…');try{var r=await SkillUp.api('/api/platform/assistant',{method:'POST',body:{message:t}}); if(r.proposal){ th.remove(); renderProposal(r.proposal, bub); } else { th.textContent=r.reply||'—'; } }catch(e){th.textContent='No pude responder ahora.';}}
  document.getElementById('oask').onclick=ask; inp.addEventListener('keydown',function(e){if(e.key==='Enter')ask();});
}
// A7 fase 2: tarjeta de confirmación de una acción propuesta por el orquestador. Ejecuta solo al confirmar.
function renderProposal(prop, bub){
  var c=bub('a', (prop.confirmar||'¿Ejecuto esta acción?'));
  c.style.borderColor='var(--gold)';
  var row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;margin-top:8px';
  var ok=document.createElement('button'); ok.className='btn btn-grad'; ok.style.cssText='padding:6px 12px;font-size:12px'; ok.textContent='Confirmar y ejecutar';
  var no=document.createElement('button'); no.className='btn btn-gh'; no.style.cssText='padding:6px 12px;font-size:12px'; no.textContent='Cancelar';
  ok.onclick=async function(){ ok.disabled=true;no.disabled=true;ok.textContent='…'; try{ var r=await SkillUp.api('/api/platform/execute',{method:'POST',body:prop}); c.textContent=r.hecho||'Hecho.'; c.style.borderColor='var(--green)'; if(r.link){ var lk=document.createElement('div'); lk.style.cssText='margin-top:6px;font-size:11px;word-break:break-all;color:var(--gold)'; lk.textContent='Enlace (cópialo): '+r.link; c.appendChild(lk); } DATA.users=null;DATA.userStates=null; }catch(e){ c.textContent='No se pudo: '+(e.message||''); c.style.borderColor='var(--red)'; } row.remove(); };
  no.onclick=function(){ c.textContent='Cancelado.'; c.style.borderColor='var(--line)'; row.remove(); };
  row.appendChild(ok); row.appendChild(no); c.appendChild(row);
  return prop;
}

/* ---------- INSIGHTS ---------- */
async function insights(box){
  box.innerHTML=hdr('Insights','El sistema aprende de todo lo que pasa: cada conversación con el tutor, cada nota, subrayado y comentario alimenta el conocimiento de cada alumno y de su empresa.','Datos vivos de la app y de qué está aprendiendo el sistema.')
    +'<div class="tiles" id="itiles"><div class="note">Cargando…</div></div><div class="note" id="ilearn"></div>';
  var d=await SkillUp.api('/api/platform/insights').catch(function(){return {};});
  document.getElementById('itiles').innerHTML=
     tile(d.conversaciones||0,'Conversaciones con tutores','teal')
    +tile(d.mensajes||0,'Mensajes intercambiados','')
    +tile(d.notasCurso||0,'Notas y aprendizajes','aub')
    +tile(d.roleplays||0,'Roleplays practicados','gold')
    +tile(d.casos||0,'Casos prácticos','')
    +tile(d.documentos||0,'Documentos de conocimiento','teal')
    +tile(d.retos||0,'Retos asignados','aub')
    +tile(d.usuarios||0,'Personas','');
  document.getElementById('ilearn').innerHTML='El sistema está aprendiendo de <b style="color:var(--teal2)">'+(d.conversaciones||0)+'</b> conversaciones y <b style="color:var(--teal2)">'+(d.notasCurso||0)+'</b> notas y comentarios de tus usuarios. Cuanto más usan la plataforma, mejor conoce a cada persona y mejor personaliza sus tutores.';
}

/* ---------- EMPRESAS ---------- */
function armed(b,fn){ if(b.getAttribute('data-armed')){ fn(); return; } var old=b.textContent, obg=b.style.background; b.setAttribute('data-armed','1'); b.textContent='¿Seguro?'; b.style.background='var(--red)'; b.style.color='#fff'; setTimeout(function(){ try{b.removeAttribute('data-armed');b.textContent=old;b.style.background=obg;}catch(e){} },4000); }
async function empresas(box){
  box.innerHTML=hdr('Empresas','Gestiona cada empresa: su suscripción (si tiene o no), su estado y acciones. Archivar la oculta del uso; desactivar la congela; eliminar la borra con todos sus datos.','Ver la suscripción ligada, archivar, activar/desactivar o eliminar empresas.')+'<div class="card scroll" id="etbl"><p class="msg">Cargando…</p></div>';
  loadOrgs();
}
function oact(o,status,label){ if(o.status===status) return ''; return '<button class="btn btn-gh" style="padding:6px 12px;font-size:11px" data-st="'+status+'" data-o="'+E(o.id)+'">'+label+'</button>'; }
async function loadOrgs(){
  var box=document.getElementById('etbl'); if(!box)return;
  var d=await SkillUp.api('/api/platform/orgs').catch(function(){return {orgs:[]};});
  var orgs=(d&&d.orgs)||[]; DATA.orgs=orgs;
  if(!orgs.length){ box.innerHTML='<p class="msg">No hay empresas.</p>'; return; }
  box.innerHTML='<table class="tbl"><thead><tr><th>Empresa</th><th>Miembros</th><th>Suscripción</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+orgs.map(function(o){
    var s=o.subscription, act=(s&&(s.status==='active'||s.status==='trialing'));
    var subTxt=s?('<span class="pill" style="color:'+(act?'var(--green)':'var(--aub2)')+'">'+E(s.tier||'—')+' · '+E(s.status||'')+(s.seats?' · '+s.seats+' asientos':'')+'</span>'):'<span class="mono">sin suscripción</span>';
    var stColor=o.status==='activa'?'var(--green)':(o.status==='archivada'?'var(--muted)':'var(--gold)');
    return '<tr'+(o.status!=='activa'?' style="opacity:.65"':'')+'><td><span class="linkname" data-open="'+E(o.id)+'"><b>'+E(o.name||'—')+'</b></span><br><span class="mono">'+E(o.slug||'')+'</span></td>'
      +'<td>'+E(String(o.members||0))+'</td><td>'+subTxt+'</td>'
      +'<td><span class="pill" style="color:'+stColor+'">'+E(o.status||'activa')+'</span></td>'
      +'<td><div class="rowflex" style="gap:6px;flex-wrap:wrap;align-items:center">'+oact(o,'archivada','Archivar')+oact(o,'inactiva','Desactivar')+oact(o,'activa','Activar')
        +'<button class="btn btn-danger" style="padding:6px 12px;font-size:11px" data-del="'+E(o.id)+'">Eliminar</button></div></td></tr>';
  }).join('')+'</tbody></table>';
  box.querySelectorAll('button[data-st]').forEach(function(b){ b.onclick=async function(){ b.disabled=true; try{ await SkillUp.api('/api/platform/orgs/status',{method:'POST',body:{organizationId:b.getAttribute('data-o'),status:b.getAttribute('data-st')}}); loadOrgs(); }catch(e){ b.disabled=false; alert('No se pudo: '+(e.message||'')); } }; });
  box.querySelectorAll('button[data-del]').forEach(function(b){ b.onclick=function(){ armed(b,async function(){ b.disabled=true; try{ await SkillUp.api('/api/platform/orgs/delete',{method:'POST',body:{organizationId:b.getAttribute('data-del')}}); loadOrgs(); }catch(e){ b.disabled=false; alert('No se pudo: '+(e.message||'')); } }); }; });
  box.querySelectorAll('span[data-open]').forEach(function(a){ a.onclick=function(){ navigate('empresas/'+a.getAttribute('data-open')); }; });
}

/* ---------- USUARIOS ---------- */
var ROLES=['empleado','coach','team_leader','inspirador','admin','direccion'];
async function usuarios(box){
  box.innerHTML=hdr('Usuarios y roles','Cambia el rol de cualquier persona en su empresa. team_leader gestiona su equipo; admin/dirección gestionan la empresa; superadmin (dorado) es global.','Todas las personas de todas las empresas. Cambiar un rol es inmediato.')
    +'<div id="pendbox"></div>'
    +'<input id="usearch" placeholder="Buscar por nombre, email o empresa…" style="max-width:360px">'
    +'<div class="card scroll" id="utbl"><p class="msg">Cargando…</p></div>';
  loadPending();
  var d=DATA.users&&DATA.users.length?{users:DATA.users}:await SkillUp.api('/api/platform/users').catch(function(){return {users:[]};});
  DATA.users=(d&&d.users)||[];

function wireVoiceJarvis(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  fab.id='jarvisFab'; fab.setAttribute('aria-label','Mantén pulsado para hablar');

  fab.innerHTML='<svg width="34" height="20" viewBox="0 0 100 58" aria-hidden="true"><g fill="none" stroke="var(--teal2)" stroke-width="6"><circle cx="30" cy="29" r="16"/><circle cx="70" cy="29" r="16"/></g><circle cx="30" cy="29" r="6" fill="var(--aub2)"/><circle cx="70" cy="29" r="6" fill="var(--aub2)"/></svg>';
  var tip=document.createElement('div');
  tip.style.cssText='position:fixed;right:20px;bottom:94px;z-index:40;max-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;box-shadow:var(--sh);font-size:13px;color:var(--body);display:none';
  document.body.appendChild(tip); document.body.appendChild(fab);
  function say(t){ tip.textContent=t; tip.style.display='block'; }
  function speak(t){ try{ var u=new SpeechSynthesisUtterance(t); u.lang='es-ES'; u.rate=1.05; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  if(!SR){ fab.title='Tu navegador no permite dictado por voz; usa «Pregunta al orquestador».'; fab.onclick=function(){ say('Este navegador no permite hablar. Usa el chat de «Pregunta al orquestador» en Resumen.'); }; return; }
  var rec=null, heard='', busy=false;
  function start(){ if(busy)return; heard=''; try{ rec=new SR(); }catch(e){ return; } rec.lang='es-ES'; rec.interimResults=true; rec.continuous=true;
    rec.onresult=function(e){ var s=''; for(var i=0;i<e.results.length;i++) s+=e.results[i][0].transcript; heard=s; say('🎙️ '+s); };
    fab.style.borderColor='var(--gold)'; fab.style.transform='scale(1.08)'; say('🎙️ Escuchando…'); try{ rec.start(); }catch(e){}
  }
  async function stop(){ fab.style.borderColor='var(--teal2)'; fab.style.transform=''; if(rec){ try{ rec.stop(); }catch(e){} } var q=heard.trim(); if(!q)  { say('No te he oído. Mantén pulsado y habla.'); return; }
    busy=true; say('Tú: '+q+'\n\n…'); try{ var r=await SkillUp.api('/api/platform/assistant',{method:'POST',body:{message:q}});
      if(r.proposal){ var cf=r.proposal.confirmar||'¿Ejecuto la acción?'; say(cf); speak(cf+'. ¿Confirmas?');
        tip.innerHTML=''; var p=document.createElement('div'); p.textContent=cf; p.style.marginBottom='8px'; tip.appendChild(p);
        var rw=document.createElement('div'); rw.style.cssText='display:flex;gap:8px';
        var okb=document.createElement('button'); okb.className='btn btn-grad'; okb.style.cssText='padding:6px 12px;font-size:12px'; okb.textContent='Confirmar';
        var nob=document.createElement('button'); nob.className='btn btn-ghost'; nob.style.cssText='padding:6px 12px;font-size:12px;border:1px solid var(--line)'; nob.textContent='Cancelar';
        okb.onclick=async function(){ okb.disabled=true; try{ var er=await SkillUp.api('/api/platform/execute',{method:'POST',body:r.proposal}); say(er.hecho||'Hecho.'); speak(er.hecho||'Hecho.'); }catch(e){ say('No se pudo: '+(e.message||'')); } };
        nob.onclick=function(){ say('Cancelado.'); };
        rw.appendChild(okb); rw.appendChild(nob); tip.appendChild(rw); tip.style.display='block';
      } else { var reply=r.reply||'No he podido responder.'; say(reply); speak(reply); }
    }catch(e){ say('No he podido responder ahora.'); } busy=false; }
  fab.addEventListener('pointerdown',function(e){ e.preventDefault(); start(); });
  fab.addEventListener('pointerup',function(e){ e.preventDefault(); stop(); });
  fab.addEventListener('pointerleave',function(){ if(rec) stop(); });
  tip.addEventListener('click',function(){ tip.style.display='none'; });
}
function boot(){
  document.querySelectorAll('.navb[data-sec]').forEach(function(b){ b.onclick=function(){ navigate(b.getAttribute('data-sec')); }; });
  try{ wireVoiceJarvis(); }catch(e){}
  document.getElementById('logout').onclick=async function(){ try{await SkillUp.api('/api/auth/sign-out',{method:'POST'});}catch(e){} location.href='/app/login.html'; };
  navigate((location.hash||'').replace('#','')||'resumen', true);
  SkillUp.api('/api/platform/pending').then(function(d){ updatePendBadge(((d&&d.pending)||[]).length); }).catch(function(){});
}
SkillUp.requireSession('/app/login.html').then(function(s){ if(!s)return;
  SkillUp.api('/api/org/me').then(function(me){
    if(!me||!me.platformAdmin){ main.innerHTML='<div class="note" style="margin-top:40px">Esta consola es solo para el superadmin. <a href="/app/inicio.html" style="color:var(--teal2)">Volver a la app</a></div>'; return; }
    boot();
  }).catch(function(){ main.innerHTML='<div class="note" style="margin-top:40px">No se pudo comprobar tu acceso. Recarga la página.</div>'; });
});
})();
</script>
