<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Superadmin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/theme.css">
<style>
table.orgs{width:100%;border-collapse:collapse;font-size:13.5px}
table.orgs th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}
table.orgs td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.orgs tr:hover td{background:var(--warm)}
.risk{color:var(--red);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--warm);border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px;color:var(--p);letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.02em}

.voice-bubble{position:fixed;right:24px;bottom:24px;width:64px;height:64px;border-radius:50%;
  background:#0E0B14;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.25);border:2px solid transparent;transition:transform .15s,border-color .2s;
  user-select:none;-webkit-user-select:none;z-index:999}
.voice-bubble .beyes{width:30px;height:auto}
.voice-bubble:hover{transform:scale(1.05)}
.voice-bubble.listening{border-color:#EC4899;animation:vbPulse 1.1s infinite}
.voice-bubble.thinking{border-color:#00D4FF}
.voice-bubble.speaking{border-color:#8B5CF6}
@keyframes vbPulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 0 rgba(236,72,153,.5)}50%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 10px rgba(236,72,153,0)}}
.voice-status{position:fixed;right:24px;bottom:96px;max-width:280px;background:#171121;color:#ECE9F3;
  font-size:12.5px;line-height:1.4;padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:999}
</style>
</head>
<body>
<div class="topbar">
  <span class="blogo">Brand<svg class="beyes" width="34" height="20" viewBox="0 0 100 58"><defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="i1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
    <radialGradient id="i2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
    </defs>
    <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
    <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
  </svg>ers<span class="sk">Superadmin</span></span>
  <nav><a href="/app/dashboard.html">← Mi panel</a></nav>
</div>
<div class="wrap">
  <div class="card">
    <h2>Coste IA de la plataforma <span class="hand" style="color:var(--t);font-size:15px">últimos 30 días, todas las empresas</span></h2>
    <div id="costBox"><span class="msg">Cargando…</span></div>
  </div>

  <div class="card">
    <h2>Todas las empresas <span class="hand" style="color:var(--t);font-size:15px">evolución, ROI y riesgo por cliente</span></h2>
    <div class="msg" id="msg">Cargando…</div>
    <div style="overflow-x:auto">
      <table class="orgs" id="orgsTable" style="display:none">
        <thead><tr>
          <th>Empresa</th><th>Miembros</th><th>Competencias</th><th>Riesgos críticos</th><th>Formado de casa</th><th>Días a autonomía</th>
        </tr></thead>
        <tbody id="orgsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="voiceBubble" class="voice-bubble" title="Mantén pulsado y habla con el orquestador">
  <svg class="beyes" width="42" height="24" viewBox="0 0 100 58"><defs>
    <linearGradient id="vg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="vg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="vi1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
    <radialGradient id="vi2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
    </defs>
    <g class="socketL" transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#vg1)" stroke-width="3"/><circle class="irisL" cx="20" cy="36" r="7.5" fill="url(#vi1)"/><circle class="pupilL" cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
    <g class="socketR" transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#vg2)" stroke-width="3"/><circle class="irisR" cx="20" cy="36" r="7.5" fill="url(#vi2)"/><circle class="pupilR" cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
  </svg>
</div>
<div id="voiceStatus" class="voice-status" hidden></div>

<script src="/app/api.js"></script>
<script>
(async function () {
  var s = await SkillUp.requireSession(); if (!s) return;

  try {
    var cost = await SkillUp.api('/api/platform/cost');
    document.getElementById('costBox').innerHTML =
      '<div class="grid">' +
      '<div class="stat"><b>' + cost.total.usd.toFixed(4) + ' $</b><span>coste total</span></div>' +
      '<div class="stat"><b>' + cost.total.calls + '</b><span>llamadas a la IA</span></div>' +
      '<div class="stat"><b>' + cost.orchestrator.usd.toFixed(4) + ' $</b><span>solo orquestador</span></div>' +
      '</div>';
  } catch (ex) {
    document.getElementById('costBox').innerHTML = '<p class="msg">' + ex.message + '</p>';
  }

  var msg = document.getElementById('msg');
  try {
    var orgs = await SkillUp.api('/api/platform/summary');
    msg.style.display = 'none';
    document.getElementById('orgsTable').style.display = 'table';
    document.getElementById('orgsBody').innerHTML = orgs.map(function (o) {
      return '<tr><td>' + SkillUp.escHtml(o.orgName) + '</td><td>' + o.memberCount + '</td><td>' + o.competencyCount + '</td>' +
        '<td' + (o.criticalRisks > 0 ? ' class="risk"' : '') + '>' + o.criticalRisks + '</td>' +
        '<td>' + Math.round(o.internalTransfer * 100) + '%</td><td>' + o.timeToAutonomyDays + '</td></tr>';
    }).join('') || '<tr><td colspan="6">Sin organizaciones todavía.</td></tr>';
  } catch (ex) {
    msg.textContent = ex.message || 'No tienes acceso de superadmin.';
  }
})();

// Orquestador por voz: mantener pulsado sobre la burbuja, hablar, soltar -> responde en voz.
// v1: solo informa con datos reales de la plataforma, no ejecuta acciones (lo dice el propio backend).
(function () {
  var bubble = document.getElementById('voiceBubble');
  var status = document.getElementById('voiceStatus');
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) { bubble.title = 'Este navegador no soporta reconocimiento de voz (usa Chrome)'; bubble.style.opacity = '0.4'; return; }

  var recog = new Recognition();
  recog.lang = 'es-ES';
  recog.interimResults = false;
  recog.maxAlternatives = 1;
  var listening = false;

  function setStatus(text) { status.hidden = !text; status.textContent = text || ''; }

  function startListening() {
    if (listening) return;
    listening = true;
    bubble.classList.add('listening');
    setStatus('Escuchando… suelta para enviar');
    try { recog.start(); } catch (e) { /* ya estaba escuchando */ }
  }
  function stopListening() {
    if (!listening) return;
    try { recog.stop(); } catch (e) {}
  }
  bubble.addEventListener('mousedown', function (e) { e.preventDefault(); startListening(); });
  bubble.addEventListener('touchstart', function (e) { e.preventDefault(); startListening(); }, { passive: false });
  document.addEventListener('mouseup', stopListening);
  document.addEventListener('touchend', stopListening);

  recog.addEventListener('end', function () { listening = false; bubble.classList.remove('listening'); });
  recog.addEventListener('error', function (e) {
    listening = false; bubble.classList.remove('listening');
    setStatus(e.error === 'not-allowed' ? 'Permiso de micrófono denegado' : '');
    setTimeout(function () { setStatus(''); }, 3000);
  });

  recog.addEventListener('result', async function (e) {
    var text = e.results[0][0].transcript;
    bubble.classList.add('thinking');
    setStatus('Revisando datos de todas las empresas…');
    try {
      var r = await SkillUp.api('/api/platform/assistant', { method: 'POST', body: { message: text } });
      bubble.classList.remove('thinking');
      speak(r.reply);
    } catch (ex) {
      bubble.classList.remove('thinking');
      setStatus(ex.message || 'Ha ido mal');
      setTimeout(function () { setStatus(''); }, 4000);
    }
  });

  function speak(text) {
    setStatus(text);
    bubble.classList.add('speaking');
    if (!window.speechSynthesis) { setTimeout(function () { setStatus(''); }, 6000); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    var voices = window.speechSynthesis.getVoices();
    var esVoice = voices.find(function (v) { return /es/i.test(v.lang); });
    if (esVoice) u.voice = esVoice;
    u.onend = function () { bubble.classList.remove('speaking'); setTimeout(function () { setStatus(''); }, 1200); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
})();
</script>
</body>
</html>
