<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Mi panel</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8B5CF6;--t:#0891B2;--ink:#0E0B14;--body:#4A4A4A;--mut:#8F8F8F;--bg:#FAFAFA;--line:#E8E0E5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--body)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:#fff}
.top nav a{margin-left:16px;font-size:13px;color:var(--mut);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{font-size:16px;color:var(--ink);margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F3EEF1;font-size:14px}
.row:last-child{border-bottom:0}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#F3EEFB;color:var(--p)}
textarea,input{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.btn{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:100px;padding:10px 18px;cursor:pointer;background:var(--p);color:#fff}
.btn.gh{background:none;color:var(--p);border:1.5px solid var(--p);padding:8.5px 16px}
.msg{font-size:13px;color:var(--mut);margin-top:6px}
.chat{max-height:220px;overflow:auto;margin-bottom:8px}
.chat .m{padding:6px 10px;border-radius:10px;margin-bottom:6px;font-size:13.5px}
.chat .m.user{background:#F3EEFB;text-align:right}
.chat .m.agent{background:#F5F5F5}
</style>
</head>
<body>
<div class="top">
  <strong id="whoami">SkillUp</strong>
  <nav>
    <a href="#" id="exportLink">Descargar mis datos</a>
    <a href="/app/validar.html">Validar casos</a>
    <a href="/app/panel.html">Panel de empresa</a>
    <a href="#" id="logout">Salir</a>
  </nav>
</div>
<div class="wrap">
  <div id="reminders"></div>
  <div class="card">
    <h2>Mis rutas</h2>
    <div id="enrollments"></div>
    <div class="msg" id="enrollEmpty" style="display:none">Aún no tienes rutas asignadas — tu responsable las configura desde el panel de empresa.</div>
  </div>

  <div class="card">
    <h2>Test de conocimiento (generado por IA para tu puesto)</h2>
    <input id="pathId" placeholder="ID de la ruta">
    <input id="competencyId" placeholder="ID de la competencia">
    <button class="btn gh" id="btnGenTest">Generar test</button>
    <div id="examBox" style="margin-top:10px"></div>
    <button class="btn" id="btnSubmitTest" style="display:none;margin-top:8px">Corregir</button>
    <div class="msg" id="testMsg"></div>
  </div>

  <div class="card">
    <h2>Caso práctico (redactado por IA con tu contexto real)</h2>
    <input id="caseCompetencyId" placeholder="ID de la competencia">
    <button class="btn gh" id="btnGenCase">Generar caso</button>
    <div id="caseCreated" style="display:none;margin-top:10px">
      <p id="caseText" style="font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px"></p>
      <textarea id="caseSubmission" placeholder="Tu resolución"></textarea>
      <button class="btn" id="btnSubmitCase">Entregar</button>
    </div>
    <div class="msg" id="caseMsg"></div>
  </div>

  <div class="card">
    <h2>Pregunta a tu asistente</h2>
    <div class="chat" id="chat"></div>
    <input id="chatInput" placeholder="Escribe tu pregunta">
    <button class="btn" id="btnChat">Enviar</button>
  </div>
</div>
<script src="/app/api.js"></script>
<script>
var threadId = null;
(async function () {
  var s = await SkillUp.requireSession();
  if (!s) return;
  document.getElementById('whoami').textContent = s.user.name || s.user.email;

  document.getElementById('logout').addEventListener('click', async function (e) {
    e.preventDefault();
    await SkillUp.api('/api/auth/sign-out', { method: 'POST' }).catch(function () {});
    window.location.href = '/app/login.html';
  });

  document.getElementById('exportLink').addEventListener('click', async function (e) {
    e.preventDefault();
    var data = await SkillUp.api('/api/privacy/export');
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mis-datos-skillup.json'; a.click();
  });

  var reminders = await SkillUp.api('/api/reminders/mine').catch(function () { return []; });
  document.getElementById('reminders').innerHTML = reminders.map(function (r) {
    return '<div class="card" style="background:#FFF8E6;border-color:#F5D98A;padding:12px 16px;font-size:13.5px">' + SkillUp.escHtml(r.message) + '</div>';
  }).join('');

  var enrollments = await SkillUp.api('/api/learning/mine').catch(function () { return []; });
  var box = document.getElementById('enrollments');
  if (!enrollments.length) { document.getElementById('enrollEmpty').style.display = 'block'; }
  enrollments.forEach(function (en) {
    var d = document.createElement('div'); d.className = 'row';
    d.innerHTML = '<span>' + SkillUp.escHtml(en.pathId) + '</span><span class="badge">' + SkillUp.escHtml(en.status) + '</span>';
    box.appendChild(d);
  });

  var currentExamId = null;
  document.getElementById('btnGenTest').addEventListener('click', async function () {
    var msg = document.getElementById('testMsg'); msg.textContent = '';
    var box = document.getElementById('examBox'); box.innerHTML = 'Generando…';
    try {
      var r = await SkillUp.api('/api/learning/test/generate', { method: 'POST', body: {
        competencyId: document.getElementById('competencyId').value.trim(),
      } });
      currentExamId = r.examId;
      box.innerHTML = r.questions.map(function (q, qi) {
        var opts = q.options.map(function (o, oi) {
          return '<label style="display:block;font-size:13.5px;margin:3px 0"><input type="radio" name="q' + qi + '" value="' + oi + '"> ' + SkillUp.escHtml(o) + '</label>';
        }).join('');
        return '<div style="margin-bottom:12px"><b style="font-size:13.5px">' + (qi + 1) + '. ' + SkillUp.escHtml(q.q) + '</b>' + opts + '</div>';
      }).join('');
      window.__exam = r.questions;
      document.getElementById('btnSubmitTest').style.display = 'inline-block';
    } catch (ex) { box.textContent = ''; msg.textContent = ex.message; }
  });
  document.getElementById('btnSubmitTest').addEventListener('click', async function () {
    var msg = document.getElementById('testMsg');
    var answers = (window.__exam || []).map(function (q, qi) {
      var sel = document.querySelector('input[name="q' + qi + '"]:checked');
      return sel ? q.options[Number(sel.value)] : '';
    });
    try {
      var r = await SkillUp.api('/api/learning/test/submit', { method: 'POST', body: {
        examId: currentExamId, pathId: document.getElementById('pathId').value.trim(),
        competencyId: document.getElementById('competencyId').value.trim(), answers: answers,
      } });
      msg.textContent = 'Puntuación ' + r.score + '/100 — ' + (r.passed ? ('aprobado, nivel ' + r.level) : 'no superado, puedes reintentar');
    } catch (ex) { msg.textContent = ex.message; }
  });

  var openCaseId = null;
  document.getElementById('btnGenCase').addEventListener('click', async function () {
    var msg = document.getElementById('caseMsg');
    try {
      var r = await SkillUp.api('/api/validation/cases/generate', { method: 'POST', body: {
        competencyId: document.getElementById('caseCompetencyId').value.trim(),
      } });
      openCaseId = r.id;
      document.getElementById('caseText').textContent = r.prompt;
      document.getElementById('caseCreated').style.display = 'block';
      msg.textContent = 'Caso generado. Escribe tu resolución y entrégala.';
    } catch (ex) { msg.textContent = ex.message; }
  });
  document.getElementById('btnSubmitCase').addEventListener('click', async function () {
    var msg = document.getElementById('caseMsg');
    try {
      await SkillUp.api('/api/validation/cases/' + openCaseId + '/submit', { method: 'POST', body: {
        submission: document.getElementById('caseSubmission').value.trim(),
      } });
      msg.textContent = 'Entregado. Queda pendiente de validación humana.';
    } catch (ex) { msg.textContent = ex.message; }
  });

  function addChatMsg(role, text) {
    var chat = document.getElementById('chat');
    var d = document.createElement('div'); d.className = 'm ' + role; d.textContent = text;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  }
  document.getElementById('btnChat').addEventListener('click', async function () {
    var input = document.getElementById('chatInput');
    var text = input.value.trim(); if (!text) return;
    addChatMsg('user', text); input.value = '';
    try {
      var r = await SkillUp.api('/api/agent/chat', { method: 'POST', body: { message: text, threadId: threadId || undefined } });
      threadId = r.threadId; addChatMsg('agent', r.reply);
    } catch (ex) { addChatMsg('agent', 'Error: ' + ex.message); }
  });
})();
</script>
</body>
</html>
