<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp · Mi panel</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/theme.css">
<style>
.chat{max-height:240px;overflow:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.chat .m{padding:9px 13px;border-radius:14px;font-size:13.5px;max-width:80%;line-height:1.5}
.chat .m.user{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat .m.agent{background:var(--warm);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.who{font-size:12px;color:var(--mut);font-weight:600}
.opt{display:block;font-size:13.5px;margin:5px 0;padding:8px 10px;border-radius:9px;transition:background .12s}
.opt:hover{background:var(--warm)}
</style>
</head>
<body>
<div class="topbar">
  <span class="blogo">Brand<svg class="beyes" width="34" height="20" viewBox="0 0 100 58"><defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="i1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
    <radialGradient id="i2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
    </defs>
    <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
    <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#g2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#i2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>
  </svg>ers<span class="sk">SkillUp</span></span>
  <nav>
    <span class="who" id="whoami" style="margin-right:8px"></span>
    <a href="#" id="exportLink">Mis datos</a>
    <a href="/app/validar.html">Validar casos</a>
    <a href="/app/panel.html">Panel de empresa</a>
    <a href="#" id="logout">Salir</a>
  </nav>
</div>
<div class="wrap">
  <div id="reminders"></div>
  <div class="card">
    <h2>Mis rutas</h2>
    <div id="enrollments"></div>
    <div class="msg" id="enrollEmpty" style="display:none">Aún no tienes rutas asignadas — tu responsable las configura desde el panel de empresa.</div>
  </div>

  <div class="card">
    <h2>Test de conocimiento <span class="hand" style="color:var(--t);font-size:15px">generado por IA para tu puesto</span></h2>
    <input id="pathId" list="pathOptions" placeholder="Busca una ruta por nombre…" autocomplete="off">
    <input id="competencyId" list="compOptions" placeholder="Busca una competencia por nombre…" autocomplete="off">
    <button class="btn btn-gh" id="btnGenTest">Generar test</button>
    <div id="examBox" style="margin-top:12px"></div>
    <button class="btn btn-grad" id="btnSubmitTest" style="display:none;margin-top:10px">Corregir</button>
    <div class="msg" id="testMsg"></div>
  </div>

  <div class="card">
    <h2>Caso práctico <span class="hand" style="color:var(--t);font-size:15px">redactado por IA con tu contexto real</span></h2>
    <input id="caseCompetencyId" list="compOptions" placeholder="Busca una competencia por nombre…" autocomplete="off">
    <button class="btn btn-gh" id="btnGenCase">Generar caso</button>
    <div id="caseCreated" style="display:none;margin-top:12px">
      <p id="caseText" style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;padding:12px 14px;background:var(--warm);border-radius:12px"></p>
      <textarea id="caseSubmission" placeholder="Tu resolución"></textarea>
      <button class="btn btn-grad" id="btnSubmitCase">Entregar</button>
    </div>
    <div class="msg" id="caseMsg"></div>
  </div>

  <datalist id="pathOptions"></datalist>
  <datalist id="compOptions"></datalist>

  <div class="card dark">
    <h2>Pregunta a tu asistente</h2>
    <div class="chat" id="chat"></div>
    <input id="chatInput" placeholder="Escribe tu pregunta">
    <button class="btn btn-grad" id="btnChat">Enviar</button>
  </div>
</div>
<script src="/app/api.js"></script>
<script>
var threadId = null;
(async function () {
  var s = await SkillUp.requireSession();
  if (!s) return;
  document.getElementById('whoami').textContent = s.user.name || s.user.email;

  document.getElementById('logout').addEventListener('click', async function (e) {
    e.preventDefault();
    await SkillUp.api('/api/auth/sign-out', { method: 'POST' }).catch(function () {});
    window.location.href = '/app/login.html';
  });

  document.getElementById('exportLink').addEventListener('click', async function (e) {
    e.preventDefault();
    var data = await SkillUp.api('/api/privacy/export');
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mis-datos-skillup.json'; a.click();
  });

  var reminders = await SkillUp.api('/api/reminders/mine').catch(function () { return []; });
  document.getElementById('reminders').innerHTML = reminders.map(function (r) {
    return '<div class="card notice" style="padding:14px 18px;font-size:13.5px;margin-bottom:12px">⏰ ' + SkillUp.escHtml(r.message) + '</div>';
  }).join('');

  // Busca-y-filtra por nombre en vez de pegar IDs a mano: datalist nativo (sin librerias) +
  // mapa nombre->id para resolver lo que la persona escribe/elige.
  var pathIdByLabel = {}, compIdByLabel = {};
  function fillDatalist(listEl, items, labelOf, map) {
    listEl.innerHTML = items.map(function (it) {
      var label = labelOf(it);
      map[label] = it.id;
      return '<option value="' + SkillUp.escHtml(label) + '">';
    }).join('');
  }
  function resolveId(inputId, map) {
    var typed = document.getElementById(inputId).value.trim();
    return map[typed] || typed; // si no coincide ninguna opcion, se manda tal cual (compatible con pegar un id)
  }
  var paths = await SkillUp.api('/api/catalog/paths').catch(function () { return []; });
  fillDatalist(document.getElementById('pathOptions'), paths, function (p) { return p.title; }, pathIdByLabel);
  var competencies = await SkillUp.api('/api/catalog/competencies').catch(function () { return []; });
  fillDatalist(document.getElementById('compOptions'), competencies, function (c) { return c.name; }, compIdByLabel);

  var enrollments = await SkillUp.api('/api/learning/mine').catch(function () { return []; });
  var box = document.getElementById('enrollments');
  if (!enrollments.length) { document.getElementById('enrollEmpty').style.display = 'block'; }
  var pathTitleById = {};
  paths.forEach(function (p) { pathTitleById[p.id] = p.title; });
  enrollments.forEach(function (en) {
    var d = document.createElement('div'); d.className = 'row';
    d.innerHTML = '<span>' + SkillUp.escHtml(pathTitleById[en.pathId] || en.pathId) + '</span><span class="badge">' + SkillUp.escHtml(en.status) + '</span>';
    box.appendChild(d);
  });

  var currentExamId = null;
  document.getElementById('btnGenTest').addEventListener('click', async function () {
    var msg = document.getElementById('testMsg'); msg.textContent = '';
    var box = document.getElementById('examBox'); box.innerHTML = 'Generando…';
    try {
      var r = await SkillUp.api('/api/learning/test/generate', { method: 'POST', body: {
        competencyId: resolveId('competencyId', compIdByLabel),
      } });
      currentExamId = r.examId;
      box.innerHTML = r.questions.map(function (q, qi) {
        var opts = q.options.map(function (o, oi) {
          return '<label class="opt"><input type="radio" name="q' + qi + '" value="' + oi + '"> ' + SkillUp.escHtml(o) + '</label>';
        }).join('');
        return '<div style="margin-bottom:14px"><b style="font-size:13.5px">' + (qi + 1) + '. ' + SkillUp.escHtml(q.q) + '</b>' + opts + '</div>';
      }).join('');
      window.__exam = r.questions;
      document.getElementById('btnSubmitTest').style.display = 'inline-block';
    } catch (ex) { box.textContent = ''; msg.textContent = ex.message; }
  });
  document.getElementById('btnSubmitTest').addEventListener('click', async function () {
    var msg = document.getElementById('testMsg');
    var answers = (window.__exam || []).map(function (q, qi) {
      var sel = document.querySelector('input[name="q' + qi + '"]:checked');
      return sel ? q.options[Number(sel.value)] : '';
    });
    try {
      var r = await SkillUp.api('/api/learning/test/submit', { method: 'POST', body: {
        examId: currentExamId, pathId: resolveId('pathId', pathIdByLabel),
        competencyId: resolveId('competencyId', compIdByLabel), answers: answers,
      } });
      msg.textContent = 'Puntuación ' + r.score + '/100 — ' + (r.passed ? ('aprobado, nivel ' + r.level) : 'no superado, puedes reintentar');
    } catch (ex) { msg.textContent = ex.message; }
  });

  var openCaseId = null;
  document.getElementById('btnGenCase').addEventListener('click', async function () {
    var msg = document.getElementById('caseMsg');
    try {
      var r = await SkillUp.api('/api/validation/cases/generate', { method: 'POST', body: {
        competencyId: resolveId('caseCompetencyId', compIdByLabel),
      } });
      openCaseId = r.id;
      document.getElementById('caseText').textContent = r.prompt;
      document.getElementById('caseCreated').style.display = 'block';
      msg.textContent = 'Caso generado. Escribe tu resolución y entrégala.';
    } catch (ex) { msg.textContent = ex.message; }
  });
  document.getElementById('btnSubmitCase').addEventListener('click', async function () {
    var msg = document.getElementById('caseMsg');
    try {
      await SkillUp.api('/api/validation/cases/' + openCaseId + '/submit', { method: 'POST', body: {
        submission: document.getElementById('caseSubmission').value.trim(),
      } });
      msg.textContent = 'Entregado. Queda pendiente de validación humana.';
    } catch (ex) { msg.textContent = ex.message; }
  });

  function addChatMsg(role, text) {
    var chat = document.getElementById('chat');
    var d = document.createElement('div'); d.className = 'm ' + role; d.textContent = text;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  }
  document.getElementById('btnChat').addEventListener('click', async function () {
    var input = document.getElementById('chatInput');
    var text = input.value.trim(); if (!text) return;
    addChatMsg('user', text); input.value = '';
    try {
      var r = await SkillUp.api('/api/agent/chat', { method: 'POST', body: { message: text, threadId: threadId || undefined } });
      threadId = r.threadId; addChatMsg('agent', r.reply);
    } catch (ex) { addChatMsg('agent', 'Error: ' + ex.message); }
  });
})();
</script>
</body>
</html>
