<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp · Mi ruta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&family=Playfair+Display:wght@700;800;900&display=swap">
<style>
:root{color-scheme:dark;--bg:#1a1820;--panel:#221f2a;--ink:#F2EFF5;--body:#DAD4E2;--muted:#968EA4;
  --aub:#8a5f7c;--aub2:#C69CB8;--teal:#1a9aa0;--teal2:#3FD8E0;--gold:#F0C645;--pink:#EC6FA6;--green:#54C79A;
  --line:rgba(180,150,205,.16);--soft:rgba(255,255,255,.05);--sh:0 24px 70px rgba(0,0,0,.5);
  --ff:"Inter",system-ui,sans-serif;--fh:"Playfair Display",Georgia,serif;--fc:"Caveat",cursive;}
:root[data-theme="light"]{color-scheme:light;--bg:#F3EFE7;--panel:#FFFFFF;--ink:#211E28;--body:#403A48;--muted:#837B90;
  --aub:#7A4E6B;--aub2:#8A5578;--teal:#0F7F86;--teal2:#0B6E78;--gold:#9C7A10;--pink:#C24E86;--green:#2E9E73;
  --line:rgba(70,50,90,.16);--soft:rgba(60,42,84,.05);--sh:0 18px 50px rgba(80,60,100,.12);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:var(--ff);color:var(--body);overflow:hidden;background:var(--bg)}
button{font-family:inherit}[hidden]{display:none!important}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.top a.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.top a.back:hover{color:var(--ink)}
.top h1{font-family:var(--fh);color:var(--ink);font-size:20px;margin:0;flex:1;min-width:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .hint{font-family:var(--fc);color:var(--teal2);font-size:16px;white-space:nowrap}
@media(max-width:560px){.top .hint{display:none}.radar-card{transform:scale(.8);transform-origin:top right;top:48px;right:8px;padding:9px 11px}}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.brain-center{position:absolute;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.92;transform:translate(-50%,-50%)}
.brain-center .bIris{animation:brainBlink 4.5s infinite}
@keyframes brainBlink{0%,92%,100%{opacity:1}96%{opacity:.15}98%{opacity:1}}
@media(prefers-reduced-motion:reduce){.brain-center .bIris{animation:none}}
.brain-center svg{width:52px;height:32px}
.brain-center span{font-family:var(--fc);color:var(--teal2);font-size:14px;white-space:nowrap}
.radar-card{position:fixed;right:20px;top:56px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.radar-card b{display:block;font-family:var(--fh);color:var(--ink);font-size:13px;margin-bottom:6px}
.radar-card svg{display:block}
.card{position:fixed;z-index:6;pointer-events:none;max-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);opacity:0;transition:opacity .12s;transform:translate(-50%,-115%);cursor:pointer}
.card.on{opacity:1;pointer-events:auto}
.card .rt{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--aub2)}
.card b{display:block;color:var(--ink);font-family:var(--fh);font-size:15px;margin:2px 0 4px}
.card small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.card .go{color:var(--teal2);font-size:11.5px;font-weight:800;margin-top:6px;display:block}
/* Barra de herramientas tipo Excalidraw, a la izquierda */
.tools{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:7;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:var(--sh)}
.tools button{position:relative;width:42px;height:42px;border:1.5px solid transparent;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.tools button:hover{color:var(--ink);background:var(--soft)}
.tools button.sel{color:var(--teal2);border-color:var(--teal2);background:rgba(63,216,224,.12)}
.tools button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools .sep{height:1px;background:var(--line);margin:3px 5px}
.tools button::after{content:attr(data-tip);position:absolute;left:50px;top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:600;white-space:nowrap;padding:5px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:var(--sh)}
.tools button:hover::after{opacity:1}
@media(max-width:560px){.tools{left:8px;padding:5px;gap:4px}.tools button{width:38px;height:38px}.tools button::after{display:none}}
.note-input{position:fixed;z-index:9;font-family:var(--fc);font-size:22px;font-weight:700;color:var(--gold);background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:4px 8px;outline:none;min-width:120px;transform:translateY(-50%);box-shadow:var(--sh)}
.a11y-list{position:fixed;left:70px;bottom:16px;z-index:5;font-size:12.5px}
.a11y-list summary{color:var(--muted);cursor:pointer;font-weight:700;list-style:none}
.a11y-list summary::-webkit-details-marker{display:none}
.a11y-list[open] summary{color:var(--ink)}
.a11y-list .lst{margin-top:8px;max-height:50vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:220px}
.a11y-list .grp{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--aub2);margin:8px 0 3px}
.a11y-list .grp:first-child{margin-top:0}
.a11y-list a{display:block;color:var(--body);text-decoration:none;padding:4px 0}
.a11y-list a:hover,.a11y-list a:focus{color:var(--teal2)}
.loader{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--bg)}
/* Selector de vista: Mapa · Flujo · Calendario */
.views{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none;pointer-events:auto}
.views button{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer}
.views button.on{background:linear-gradient(120deg,var(--teal),var(--aub));color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;top:54px;z-index:4;overflow-y:auto;padding:16px 16px 40px;background:var(--bg)}
/* Flujo (pasos + flechas curvas, arrastrable) */
.flowtip{max-width:640px;margin:0 auto 12px;color:var(--muted);font-size:13px;text-align:center}
.flow{max-width:640px;margin:0 auto}
.fstep{position:relative;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;cursor:grab;transition:border-color .15s}
.fstep.drag{opacity:.4}.fstep.over{border-color:var(--teal2);box-shadow:0 0 0 2px rgba(63,216,224,.3)}
.fstep .fn{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.fstep .fb{flex:1;min-width:0}.fstep .fb b{color:var(--ink);font-size:14.5px;display:block}.fstep .fb small{color:var(--muted);font-size:12.5px}
.fstep .fgo{color:var(--teal2);font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}
.fstep .fgrip{color:var(--muted);font-size:16px;cursor:grab;flex:none}
.farrow{display:flex;justify-content:center;height:30px}
.farrow svg{overflow:visible}
/* Calendario de aprendizaje */
.cal{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.caltip{max-width:680px;margin:0 auto 12px;color:var(--muted);font-size:13px;text-align:center}
.cday{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cday .cdate{flex:none;width:52px;text-align:center}
.cday .cdate .cd{font-size:22px;font-weight:800;color:var(--ink);line-height:1}
.cday .cdate .cm{font-size:11px;color:var(--muted);text-transform:uppercase}
.cday .cbody{flex:1;min-width:0}.cday .cbody b{color:var(--ink);font-size:14.5px;display:block}.cday .cbody small{color:var(--muted);font-size:12.5px}
.ctag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin:6px 6px 0 0}
.ctag.t{background:rgba(63,216,224,.16);color:var(--teal2)}.ctag.r{background:rgba(236,111,166,.16);color:var(--pink)}.ctag.c{background:rgba(240,198,69,.16);color:var(--gold)}
.cadd{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;color:var(--teal2);text-decoration:none}
/* Dos columnas: lista + calendario visual del mes */
.calwrap{max-width:940px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:720px){.calwrap{grid-template-columns:1fr}}
.calcol-title{font-family:var(--fh);color:var(--ink);font-size:15px;margin:0 0 10px}
.month{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;margin-bottom:12px}
.mtitle{font-weight:800;color:var(--ink);font-size:13.5px;text-align:center;text-transform:capitalize;margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mgrid .wd{text-align:center;font-size:10px;font-weight:800;color:var(--muted);padding-bottom:2px}
.mc{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}
.mc .dn{font-size:11.5px;color:var(--body)}
.mc.empty{visibility:hidden}
.mc.has .dn{color:#fff;font-weight:800}
.mc.has{box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}
</style>
</head>
<body>
<div class="loader" id="loader">Cargando tu mapa…</div>
<div class="top" id="top" hidden><a class="back" href="/app/inicio.html">‹ Inicio</a><h1>Mi ruta</h1><div class="views" id="views"><button data-v="mapa" class="on">Mapa</button><button data-v="flujo">Flujo</button><button data-v="cal">Calendario</button></div></div>
<div id="stage" hidden><canvas id="cv"></canvas>
  <div class="brain-center" id="brainCenter" aria-hidden="true"></div>
  <div class="radar-card" id="radarCard" hidden></div>
</div>
<div class="sheet" id="flowSheet" hidden></div>
<div class="sheet" id="calSheet" hidden></div>
<nav class="tools" id="tools" hidden aria-label="Herramientas del mapa">
  <button data-tool="move" data-tip="Mover (arrastra)" class="sel" aria-label="Mover"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-1a8 8 0 0 1-7-4l-2.5-4.5a2 2 0 0 1 3.4-2L8 15"/></svg></button>
  <button data-tool="arrow" data-tip="Flecha" aria-label="Flecha"><svg viewBox="0 0 24 24"><path d="M4 13c6-7 10-7 16-1"/><path d="M14 5l6 6-1 7"/></svg></button>
  <button data-tool="note" data-tip="Nota a mano" aria-label="Nota"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  <div class="sep"></div>
  <button data-act="zin" data-tip="Acercar" aria-label="Acercar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M11 8v6M8 11h6"/></svg></button>
  <button data-act="zout" data-tip="Alejar" aria-label="Alejar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6"/></svg></button>
  <button data-act="fit" data-tip="Centrar" aria-label="Centrar"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button data-act="clear" data-tip="Borrar notas" aria-label="Borrar notas"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
</nav>
<div class="card" id="card" tabindex="-1"></div>
<details class="a11y-list" id="a11yList" hidden><summary>Ver tus cursos como lista</summary><div class="lst" id="a11yLst"></div></details>
<script src="/app/api.js"></script>
<script>
(function(){
"use strict";
try{ if(localStorage.getItem('skillup-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
var loader=document.getElementById('loader'),top=document.getElementById('top'),stage=document.getElementById('stage'),cv=document.getElementById('cv'),card=document.getElementById('card'),toolsEl=document.getElementById('tools');
if(!window.SkillUp||!SkillUp.api){loader.textContent='No se pudo cargar. Vuelve a entrar.';return;}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var COURSES=[
 {name:'Guía del Coach',src:'/index.html',desc:'Acompañar a quien llega en sus primeros meses.',rt:'Ruta A'},
 {name:'Prospección con IA',src:'/prospeccion-social-selling.html',desc:'Encontrar y abrir con criterio.',rt:'Ruta A'},
 {name:'Outbound Sales',src:'/outbound-sales.html',desc:'Vender en frío sin sonar a vendedor.',rt:'Ruta B'},
 {name:'Reclutamiento de Partners',src:'/reclutamiento-partners.html',desc:'Captar partners de 0 a 100.',rt:'Ruta B'},
 {name:'Marketing para Partners',src:'/marketing-partners.html',desc:'Generar demanda B2B.',rt:'Ruta C'},
 {name:'Negociación',src:'/negociacion-partner-manager.html',desc:'Cerrar sin perder margen.',rt:'Ruta D'},
 {name:'Objeciones',src:'/objeciones-partner-manager.html',desc:'Manejar el no y darle la vuelta.',rt:'Ruta D'}
];
var RUTAS=['Ruta A','Ruta B','Ruta C','Ruta D'];
var RCOL={'Ruta A':'#3FD8E0','Ruta B':'#EC6FA6','Ruta C':'#F0C645','Ruta D':'#8a5f7c'};
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}

var W=0,H=0,DPR=Math.max(1,window.devicePixelRatio||1),ctx=cv.getContext('2d');
function resize(){W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';}
addEventListener('resize',resize);

// --- Cámara (pan/zoom estilo Excalidraw). El mapa vive en coordenadas de "mundo" centradas en (0,0). ---
var cam={x:0,y:0,scale:1};
function s2w(sx,sy){ return {x:(sx-cam.x)/cam.scale, y:(sy-cam.y)/cam.scale}; }
function w2s(wx,wy){ return {x:wx*cam.scale+cam.x, y:wy*cam.scale+cam.y}; }

var nodes=[],clusters={};
function buildLayout(counts){
  var R=260; // radio del mundo (centrado en 0,0 -> luego la cámara lo centra en pantalla)
  RUTAS.forEach(function(rt,i){ var a=(-90+i*(360/RUTAS.length))*Math.PI/180; clusters[rt]={x:Math.cos(a)*R,y:Math.sin(a)*R,angle:a}; });
  var maxN=1; COURSES.forEach(function(c){ if((counts[c.src]||0)>maxN) maxN=counts[c.src]||0; });
  nodes=COURSES.map(function(c){
    var cl=clusters[c.rt]; var siblings=COURSES.filter(function(x){return x.rt===c.rt;}); var pos=siblings.indexOf(c);
    var spread=(pos-(siblings.length-1)/2)*0.62; var h=hash(c.src);
    var baseA=cl.angle+spread+((h%100)/100-0.5)*0.25;
    var baseR=64+((h>>3)%22);
    var n=(counts[c.src]||0), size=9+Math.round((n/maxN)*13);
    return {c:c,cluster:c.rt,angle:baseA,baseR:baseR,expandR:baseR+150,r:baseR,size:size,n:n,
      x:cl.x+Math.cos(baseA)*baseR,y:cl.y+Math.sin(baseA)*baseR,phase:Math.random()*Math.PI*2,cx:cl.x,cy:cl.y};
  });
}
function fitView(){
  var xs=[0],ys=[0];
  RUTAS.forEach(function(rt){ var c=clusters[rt]; xs.push(c.x);ys.push(c.y); });
  nodes.forEach(function(n){ var rr=n.baseR; xs.push(n.cx+Math.cos(n.angle)*rr+n.size); xs.push(n.cx+Math.cos(n.angle)*rr-n.size); ys.push(n.cy+Math.sin(n.angle)*rr+n.size); ys.push(n.cy+Math.sin(n.angle)*rr-n.size); });
  var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  var padX=70,padY=110, bw=(maxX-minX)||1, bh=(maxY-minY)||1;
  var sc=Math.min((W-padX*2)/bw,(H-padY*2)/bh); sc=Math.max(0.4,Math.min(sc,1.5));
  cam.scale=sc; cam.x=W/2-((minX+maxX)/2)*sc; cam.y=(H/2+8)-((minY+maxY)/2)*sc;
}
function zoomAt(sx,sy,f){ var w=s2w(sx,sy); cam.scale=Math.max(0.3,Math.min(2.6,cam.scale*f)); cam.x=sx-w.x*cam.scale; cam.y=sy-w.y*cam.scale; }

// --- Anotaciones (flechas y notas a mano), guardadas por ruta en este navegador. ---
var annos=[], ANNO_KEY='skillup-ruta-annos:default';
function saveAnnos(){ try{ localStorage.setItem(ANNO_KEY, JSON.stringify(annos)); }catch(e){} }
function loadAnnos(){ try{ annos=JSON.parse(localStorage.getItem(ANNO_KEY)||'[]')||[]; }catch(e){ annos=[]; } }

var hoverRuta=null,hoverNode=null,mouseSX=-999,mouseSY=-999,tHover={},drawing=null,panning=false,downMoved=false; RUTAS.forEach(function(r){tHover[r]=0;});
function pick(wx,wy){ var best=null,bestD=1e9; nodes.forEach(function(n){ var tol=30+n.size; var dx=wx-n.x,dy=wy-n.y,d=dx*dx+dy*dy; if(d<tol*tol&&d<bestD){best=n;bestD=d;} }); return best; }
function nearestRuta(wx,wy){ var near=null,bd=9999; RUTAS.forEach(function(rt){ var cl=clusters[rt]; var d=Math.hypot(wx-cl.x,wy-cl.y); if(d<200&&d<bd){bd=d;near=rt;} }); return near; }

// --- Herramientas ---
var tool='move';
function setTool(t){ tool=t; Array.prototype.forEach.call(toolsEl.querySelectorAll('button[data-tool]'),function(b){ b.classList.toggle('sel', b.getAttribute('data-tool')===t); });
  cv.style.cursor = t==='move'?'grab':(t==='note'?'text':'crosshair'); }
toolsEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tool){ setTool(b.dataset.tool); return; }
  var a=b.dataset.act;
  if(a==='zin') zoomAt(W/2,H/2,1.25); else if(a==='zout') zoomAt(W/2,H/2,0.8); else if(a==='fit') fitView();
  else if(a==='clear'){ if(annos.length){ annos=[]; saveAnnos(); } }
});

function placeNote(sx,sy){
  var w=s2w(sx,sy);
  var inp=document.createElement('input'); inp.className='note-input'; inp.placeholder='escribe…';
  inp.style.left=sx+'px'; inp.style.top=sy+'px'; document.body.appendChild(inp);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },0); // el foco tras terminar el gesto de puntero, si no se pierde
  var done=false;
  function commit(){ if(done)return; done=true; var t=inp.value.trim(); if(t){ annos.push({t:'note',x:w.x,y:w.y,text:t.slice(0,140),col:'#F0C645'}); saveAnnos(); } inp.remove(); setTool('move'); }
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } else if(e.key==='Escape'){ done=true; inp.remove(); setTool('move'); } });
  inp.addEventListener('blur',commit);
}

// --- Puntero unificado (ratón + táctil) ---
var lastSX=0,lastSY=0;
cv.addEventListener('pointerdown',function(e){
  lastSX=e.clientX; lastSY=e.clientY; downMoved=false;
  var w=s2w(e.clientX,e.clientY);
  if(tool==='note'){ placeNote(e.clientX,e.clientY); return; }  // sin captura: el input recibe el foco bien
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  if(tool==='arrow'){ drawing={x1:w.x,y1:w.y,x2:w.x,y2:w.y}; return; }
  panning=true; cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',function(e){
  mouseSX=e.clientX; mouseSY=e.clientY;
  var dx=e.clientX-lastSX, dy=e.clientY-lastSY;
  if(Math.abs(dx)+Math.abs(dy)>3) downMoved=true;
  if(drawing){ var w=s2w(e.clientX,e.clientY); drawing.x2=w.x; drawing.y2=w.y; }
  else if(panning){ cam.x+=dx; cam.y+=dy; }
  lastSX=e.clientX; lastSY=e.clientY;
});
function endPointer(e){
  if(drawing){ var len=Math.hypot(drawing.x2-drawing.x1,drawing.y2-drawing.y1); if(len>10/cam.scale){ annos.push({t:'arrow',x1:drawing.x1,y1:drawing.y1,x2:drawing.x2,y2:drawing.y2,col:'#EC6FA6'}); saveAnnos(); } drawing=null; return; }
  if(panning){ panning=false; cv.style.cursor=(tool==='move'?'grab':'crosshair');
    if(!downMoved && tool==='move'){ var w=s2w(e.clientX,e.clientY); var hit=pick(w.x,w.y); if(hit){ location.href='/app/curso.html?src='+encodeURIComponent(hit.c.src); } }
  }
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',function(){ drawing=null; panning=false; });
cv.addEventListener('pointerleave',function(){ if(!panning){ mouseSX=mouseSY=-999; } });
cv.addEventListener('wheel',function(e){ e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016)); },{passive:false});
card.addEventListener('click',function(){ if(card.dataset.src) location.href='/app/curso.html?src='+encodeURIComponent(card.dataset.src); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ setTool('move'); }
  else if(e.key==='+'||e.key==='='){ zoomAt(W/2,H/2,1.2); }
  else if(e.key==='-'){ zoomAt(W/2,H/2,0.83); }
});

function updateHover(){
  if(tool!=='move'||panning){ card.classList.remove('on'); hoverNode=null; return; }
  var w=s2w(mouseSX,mouseSY);
  hoverRuta=nearestRuta(w.x,w.y);
  var hit=pick(w.x,w.y); hoverNode=hit;
  if(hit){ var sp=w2s(hit.x,hit.y);
    card.classList.add('on'); card.style.left=sp.x+'px'; card.style.top=(sp.y-hit.size*cam.scale-8)+'px'; card.dataset.src=hit.c.src;
    card.innerHTML='<span class="rt">'+esc(hit.cluster)+'</span><b>'+esc(hit.c.name)+'</b><small>'+esc(hit.c.desc)+'</small><span class="go">'+(hit.n?hit.n+' aportaciones · ':'')+'Entrar ›</span>';
  } else card.classList.remove('on');
}

function jitterCurve(x1,y1,x2,y2,seed){ var mx=(x1+x2)/2,my=(y1+y2)/2; var dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1; var nx=-dy/len,ny=dx/len; var amt=((seed%17)-8)*2.1; return {mx:mx+nx*amt,my:my+ny*amt}; }
function drawSketchLine(x1,y1,x2,y2,seed,color,alpha,width){ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash([5,7]); ctx.lineCap='round'; var j=jitterCurve(x1,y1,x2,y2,seed); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(j.mx,j.my,x2,y2); ctx.stroke(); ctx.restore(); }
function drawArrow(x1,y1,x2,y2,col,ghost){ ctx.save(); ctx.globalAlpha=ghost?0.5:1; ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); var a=Math.atan2(y2-y1,x2-x1),h=13; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-h*Math.cos(a-0.42),y2-h*Math.sin(a-0.42)); ctx.lineTo(x2-h*Math.cos(a+0.42),y2-h*Math.sin(a+0.42)); ctx.closePath(); ctx.fill(); ctx.restore(); }
function drawNote(a){ ctx.save(); ctx.font='700 22px "Caveat",cursive'; ctx.fillStyle=a.col||'#F0C645'; ctx.textBaseline='middle'; ctx.beginPath(); ctx.arc(a.x,a.y,3,0,7); ctx.fill(); ctx.fillText(a.text,a.x+9,a.y); ctx.restore(); }
var rootStyles=getComputedStyle(document.documentElement);
function tok(name,fallback){ var v=rootStyles.getPropertyValue(name); return v?v.trim():fallback; }
var brainCenter=document.getElementById('brainCenter');

function frame(t){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(cam.x,cam.y); ctx.scale(cam.scale,cam.scale);
  RUTAS.forEach(function(rt){ tHover[rt]+=((hoverRuta===rt?1:0)-tHover[rt])*0.09; });
  for(var i=0;i<RUTAS.length;i++){ for(var j=i+1;j<RUTAS.length;j++){ var a=clusters[RUTAS[i]],b=clusters[RUTAS[j]]; drawSketchLine(a.x,a.y,b.x,b.y,i*7+j,'rgba(150,140,170,.22)',1,1.1); }}
  // Nodos QUIETOS (Marc: "se mueve mucho, la animación sobra"): sin respirar ni expandir, fáciles de clicar.
  // El foco al pasar por encima lo da el resaltado/atenuado (tHover), no el movimiento. Tamaños por nivel intactos.
  nodes.forEach(function(n){ n.x=n.cx+Math.cos(n.angle)*n.baseR; n.y=n.cy+Math.sin(n.angle)*n.baseR; });
  updateHover();
  RUTAS.forEach(function(rt){ var sib=nodes.filter(function(n){return n.cluster===rt;}); var op=0.14+tHover[rt]*0.55; for(var i=0;i<sib.length;i++){ drawSketchLine(clusters[rt].x,clusters[rt].y,sib[i].x,sib[i].y,i*13+1,RCOL[rt],op,1.3); for(var j=i+1;j<sib.length;j++){ drawSketchLine(sib[i].x,sib[i].y,sib[j].x,sib[j].y,i*5+j*3,RCOL[rt],op*0.7,1); } } });
  nodes.forEach(function(n){ var dim=hoverRuta&&hoverRuta!==n.cluster?0.3:1; ctx.save(); ctx.globalAlpha=dim; ctx.beginPath(); ctx.arc(n.x,n.y,n.size,0,Math.PI*2); ctx.fillStyle=RCOL[n.cluster]; ctx.globalAlpha=dim*(0.16+tHover[n.cluster]*0.18); ctx.fill(); ctx.globalAlpha=dim; ctx.beginPath(); ctx.arc(n.x,n.y,n.size*0.52,0,Math.PI*2); ctx.fillStyle=RCOL[n.cluster]; ctx.fill(); ctx.strokeStyle=tok('--panel','#221f2a'); ctx.lineWidth=2; ctx.stroke(); ctx.restore(); });
  annos.forEach(function(a){ if(a.t==='arrow') drawArrow(a.x1,a.y1,a.x2,a.y2,a.col); else if(a.t==='note') drawNote(a); });
  if(drawing) drawArrow(drawing.x1,drawing.y1,drawing.x2,drawing.y2,'#EC6FA6',true);
  ctx.restore();
  var pc=w2s(0,0); brainCenter.style.left=pc.x+'px'; brainCenter.style.top=pc.y+'px';
  requestAnimationFrame(frame);
}

function paintBrainCenter(){ brainCenter.innerHTML='<svg viewBox="0 0 100 58"><g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#3FD8E0" stroke-width="3.5"/><circle class="bIris" cx="20" cy="36" r="8" fill="#C69CB8"/><circle cx="20" cy="36" r="3.6" fill="#0a0a0f"/></g><g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#F0C645" stroke-width="3.5"/><circle class="bIris" cx="20" cy="36" r="8" fill="#3FD8E0"/><circle cx="20" cy="36" r="3.6" fill="#0a0a0f"/></g></svg><span>tu cerebro de conocimiento</span>'; }
function paintRadar(radar){ var rc=document.getElementById('radarCard'); var max=Math.max(3,radar.aprende,radar.aporta,radar.aplica); var cx=80,cy=80,R=40, axes=[{k:'aprende',lbl:'Aprende',ang:-90},{k:'aporta',lbl:'Aporta',ang:30},{k:'aplica',lbl:'Aplica',ang:150}];
  function pt(ang,r){ var a=ang*Math.PI/180; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; }
  var poly=axes.map(function(ax){ var v=radar[ax.k]||0; var r=(v/max)*R; return pt(ax.ang,r).join(','); }).join(' ');
  var grid=[0.33,0.66,1].map(function(f){ return '<polygon points="'+axes.map(function(ax){return pt(ax.ang,R*f).join(',');}).join(' ')+'" fill="none" stroke="rgba(150,140,170,.22)" stroke-width="1"/>'; }).join('');
  var spokes=axes.map(function(ax){ var p=pt(ax.ang,R); return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="rgba(150,140,170,.22)" stroke-width="1"/>'; }).join('');
  var labels=axes.map(function(ax){ var p=pt(ax.ang,R+22); return '<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" dominant-baseline="middle" font-family="Caveat, cursive" font-size="15" fill="'+(ax.k==='aprende'?'#3FD8E0':ax.k==='aporta'?'#EC6FA6':'#F0C645')+'">'+ax.lbl+'</text>'; }).join('');
  rc.innerHTML='<b>Tu perfil real de aprendizaje</b><svg width="160" height="150" viewBox="0 0 160 150">'+grid+spokes+'<polygon points="'+poly+'" fill="rgba(63,216,224,.22)" stroke="#3FD8E0" stroke-width="1.6"/>'+labels+'</svg>'; rc.hidden=false; }
var RPAL=['#3FD8E0','#EC6FA6','#F0C645','#8a5f7c','#54C79A','#C69CB8'];
var RPLAN=null; // plan completo (todos los módulos, para las vistas Flujo y Calendario)
function applyRealRoute(plan){ RPLAN=plan||null; if(!plan||!plan.modulos||!plan.modulos.length) return false; var mods=plan.modulos.filter(function(m){return m&&m.courseSrc;}); if(!mods.length) return false;
  COURSES=mods.map(function(m){return {name:m.titulo||'Módulo',src:m.courseSrc,desc:m.resumen||'',rt:m.titulo||'Módulo'};});
  RUTAS=COURSES.map(function(c){return c.rt;}); RCOL={}; RUTAS.forEach(function(rt,i){RCOL[rt]=RPAL[i%RPAL.length];}); tHover={}; RUTAS.forEach(function(r){tHover[r]=0;});
  var h1=document.querySelector('.top h1'); if(h1&&plan.titulo){ h1.textContent=plan.titulo; ANNO_KEY='skillup-ruta-annos:'+plan.titulo; } return true; }

// --- Vistas Flujo (pasos + flechas, reordenable) y Calendario de aprendizaje ---
function courseUrl(src){ return src ? location.origin+'/app/curso.html?src='+encodeURIComponent(src) : ''; }
function currentMods(){ return (RPLAN&&RPLAN.modulos&&RPLAN.modulos.length)?RPLAN.modulos.slice():COURSES.map(function(c){return {titulo:c.name,courseSrc:c.src,resumen:c.desc};}); }
function saveOrder(mods){ if(!RPLAN) RPLAN={titulo:((document.querySelector('.top h1')||{}).textContent)||'Tu ruta',resumen:''}; RPLAN.modulos=mods;
  try{ SkillUp.api('/api/notes/add',{method:'POST',body:{source:'ruta',kind:'insight',body:'[ruta-plan] '+JSON.stringify(RPLAN)}}); }catch(e){} }
function renderFlow(){
  var mods=currentMods(); var sh=document.getElementById('flowSheet');
  if(!mods.length){ sh.innerHTML='<p class="flowtip">Aún no tienes ruta. <a href="/app/ruta-crear.html" style="color:var(--teal2)">Créala ›</a></p>'; return; }
  var pal=['#3FD8E0','#EC6FA6','#F0C645','#8a5f7c','#54C79A','#C69CB8'];
  var arrow='<div class="farrow"><svg width="40" height="30" viewBox="0 0 40 30"><path d="M20 0 C 8 10, 32 20, 20 27" fill="none" stroke="#C69CB8" stroke-width="2.2" stroke-dasharray="5 6" stroke-linecap="round"/><path d="M20 27 l-5 -6 M20 27 l5 -6" fill="none" stroke="#C69CB8" stroke-width="2.2" stroke-linecap="round"/></svg></div>';
  var html='<p class="flowtip">Tu ruta paso a paso. Arrastra ⠿ para reordenar; se guarda solo.</p><div class="flow">';
  mods.forEach(function(m,i){ var col=pal[i%pal.length]; if(i>0) html+=arrow;
    var go=m.courseSrc?'<a class="fgo" href="/app/curso.html?src='+encodeURIComponent(m.courseSrc)+'">Entrar ›</a>':'<span class="fgo" style="color:var(--gold)">En preparación</span>';
    html+='<div class="fstep" draggable="true" data-i="'+i+'"><span class="fgrip">⠿</span><span class="fn" style="background:linear-gradient(135deg,'+col+',#8a5f7c)">'+(i+1)+'</span><span class="fb"><b>'+esc(m.titulo||'Módulo')+'</b><small>'+esc(m.resumen||'')+'</small></span>'+go+'</div>'; });
  html+='</div>'; sh.innerHTML=html;
  var dragI=null;
  sh.querySelectorAll('.fstep').forEach(function(el){
    el.addEventListener('dragstart',function(){ dragI=Number(el.dataset.i); el.classList.add('drag'); });
    el.addEventListener('dragend',function(){ el.classList.remove('drag'); sh.querySelectorAll('.fstep').forEach(function(x){x.classList.remove('over');}); });
    el.addEventListener('dragover',function(e){ e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave',function(){ el.classList.remove('over'); });
    el.addEventListener('drop',function(e){ e.preventDefault(); var toI=Number(el.dataset.i); if(dragI==null||dragI===toI) return;
      var arr=currentMods(); var moved=arr.splice(dragI,1)[0]; arr.splice(toI,0,moved); saveOrder(arr); renderFlow(); });
  });
}
function fmtCalDate(d){ function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+''+p(d.getMonth()+1)+''+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'; }
function gcalLink(title,details,day){ var s=new Date(day); s.setHours(9,0,0,0); var e=new Date(day); e.setHours(10,0,0,0);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&details='+encodeURIComponent(details)+'&dates='+fmtCalDate(s)+'/'+fmtCalDate(e); }
var MES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
var MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var CPAL=['#3FD8E0','#EC6FA6','#F0C645','#8a5f7c','#54C79A','#C69CB8'];
function monthGrid(y,mo,sessions){
  var startDow=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate(), marks={};
  sessions.forEach(function(s){ if(s.date.getFullYear()===y&&s.date.getMonth()===mo) marks[s.date.getDate()]=s; });
  var cells=''; for(var i=0;i<startDow;i++) cells+='<div class="mc empty"></div>';
  for(var d=1;d<=days;d++){ var s=marks[d];
    if(s) cells+='<div class="mc has" style="background:'+s.color+'"'+(s.m.courseSrc?' data-src="'+esc(s.m.courseSrc)+'"':'')+' title="'+esc(s.m.titulo||'')+'"><span class="dn">'+d+'</span></div>';
    else cells+='<div class="mc"><span class="dn">'+d+'</span></div>'; }
  return '<div class="month"><div class="mtitle">'+MESL[mo]+' '+y+'</div><div class="mgrid"><div class="wd">L</div><div class="wd">M</div><div class="wd">X</div><div class="wd">J</div><div class="wd">V</div><div class="wd">S</div><div class="wd">D</div>'+cells+'</div></div>';
}
function renderCal(){
  var mods=currentMods(); var sh=document.getElementById('calSheet');
  if(!mods.length){ sh.innerHTML='<p class="caltip">Aún no tienes ruta. <a href="/app/ruta-crear.html" style="color:var(--teal2)">Créala ›</a></p>'; return; }
  var today=new Date(); today.setHours(0,0,0,0);
  var sessions=mods.map(function(m,i){ return { m:m, i:i, date:new Date(today.getTime()+i*3*86400000), color:CPAL[i%CPAL.length] }; });
  // Columna LISTA
  var list=sessions.map(function(s){ var m=s.m, day=s.date, i=s.i;
    var title='SkillUp · '+(m.titulo||'Módulo');
    var details=(m.resumen||'')+(m.courseSrc?('\n\nEntrar al temario: '+courseUrl(m.courseSrc)):'');
    var go=m.courseSrc?'<a class="cadd" href="/app/curso.html?src='+encodeURIComponent(m.courseSrc)+'">Entrar al temario ›</a> &nbsp; ':'';
    return '<div class="cday"><div class="cdate"><div class="cd">'+day.getDate()+'</div><div class="cm">'+MES[day.getMonth()]+'</div></div>'
      +'<div class="cbody"><b>'+(i+1)+'. '+esc(m.titulo||'Módulo')+'</b><small>'+esc(m.resumen||'')+'</small>'
      +'<div><span class="ctag t">Test al final</span><span class="ctag c">Caso práctico</span>'+(i%2?'<span class="ctag r">Roleplay</span>':'')+'</div>'
      +go+'<a class="cadd" target="_blank" rel="noopener" href="'+gcalLink(title,details,day)+'">Añadir a Google Calendar ›</a></div></div>'; }).join('');
  // Columna MES (uno o varios meses que abarca la ruta)
  var months='', cur=new Date(sessions[0].date.getFullYear(),sessions[0].date.getMonth(),1);
  var last=sessions[sessions.length-1].date, end=new Date(last.getFullYear(),last.getMonth(),1);
  while(cur<=end){ months+=monthGrid(cur.getFullYear(),cur.getMonth(),sessions); cur.setMonth(cur.getMonth()+1); }
  sh.innerHTML='<p class="caltip">Un plan realista: un módulo cada pocos días, con test y práctica. Añádelo a tu calendario y entra desde el propio evento.</p>'
    +'<div class="calwrap"><div><div class="calcol-title">Lista</div><div class="cal">'+list+'</div></div>'
    +'<div><div class="calcol-title">Mes</div>'+months+'</div></div>';
  sh.querySelectorAll('.mc.has[data-src]').forEach(function(el){ el.onclick=function(){ location.href='/app/curso.html?src='+encodeURIComponent(el.getAttribute('data-src')); }; });
}
function setView(v){
  document.querySelectorAll('#views button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===v); });
  stage.hidden = v!=='mapa'; toolsEl.hidden = v!=='mapa';
  document.getElementById('flowSheet').hidden = v!=='flujo';
  document.getElementById('calSheet').hidden = v!=='cal';
  if(v==='flujo') renderFlow(); else if(v==='cal') renderCal();
}

SkillUp.session().then(function(s){
  if(!s||!s.user){ location.href='/app/login.html'; return; }
  return Promise.all([
    SkillUp.api('/api/notes/list').catch(function(){return {items:[]};}),
    SkillUp.api('/api/learning/route').catch(function(){return {plan:null};})
  ]).then(function(res){
    var d=res[0]||{items:[]}; var hasRoute=applyRealRoute(res[1]&&res[1].plan);
    var summ=document.querySelector('#a11yList summary'); if(summ) summ.textContent=hasRoute?'Ver los pasos de tu ruta':'Ver los cursos como lista';
    var hint=document.querySelector('.top .hint'); if(hint&&!hasRoute) hint.innerHTML='<a href="/app/ruta-crear.html" style="color:var(--teal2);text-decoration:none">crea tu ruta a medida ›</a>';
    var counts={}; var radar={aprende:0,aporta:0,aplica:0};
    (d&&d.items||[]).forEach(function(it){ if(!it||!it.source||it.source==='onboarding'||it.source==='ruta'||it.source==='cuenta'||it.source==='reto')return; counts[it.source]=(counts[it.source]||0)+1;
      var body=String(it.body||''); if(it.kind==='insight'){ if(body.indexOf('[sintesis]')===0)return; if(body.indexOf('[adopcion:aplicar]')===0)radar.aplica+=1; else if(body.indexOf('[adopcion:repasar]')===0)radar.aplica+=0.3; else radar.aporta+=1; } else radar.aprende+=1; });
    resize(); buildLayout(counts); loadAnnos(); fitView();
    var a11yLst=document.getElementById('a11yLst');
    if(hasRoute){ a11yLst.innerHTML='<div class="grp">'+esc(document.querySelector('.top h1').textContent)+'</div>'+COURSES.map(function(c,i){ return '<a href="/app/curso.html?src='+encodeURIComponent(c.src)+'"><b style="color:var(--muted);font-weight:800">'+(i+1)+'.</b> '+esc(c.name)+(counts[c.src]?' · '+counts[c.src]:'')+'</a>'; }).join(''); }
    else { a11yLst.innerHTML=RUTAS.map(function(rt){ return '<div class="grp">'+esc(rt)+'</div>'+COURSES.filter(function(c){return c.rt===rt;}).map(function(c){ return '<a href="/app/curso.html?src='+encodeURIComponent(c.src)+'">'+esc(c.name)+(counts[c.src]?' · '+counts[c.src]:'')+'</a>'; }).join(''); }).join(''); }
    document.getElementById('a11yList').hidden=false;
    paintBrainCenter(); paintRadar(radar); setTool('move');
    loader.hidden=true; top.hidden=false; stage.hidden=false; toolsEl.hidden=false;
    document.getElementById('views').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) setView(b.getAttribute('data-v')); });
    requestAnimationFrame(frame);
  });
}).catch(function(){ loader.textContent='No se pudo cargar. Recarga la página.'; });
})();
