<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp · Certificado</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/assess.css">
<style>
/* El certificado es "papel": siempre claro, en cualquier tema. Medidas relativas al propio ancho (cqw) para que
   se vea igual en un móvil de 360 px, en escritorio y en un A4 apaisado impreso. */
.stagec{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.certbox{container-type:inline-size;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.45);border-radius:6px}
.cert{--ink:#211E28;--aub:#6E4763;--gold:#A9862A;--teal:#0F7F86;--paper:#FBF8F2;
  position:relative;aspect-ratio:297/210;background:var(--paper);color:var(--ink);overflow:hidden;border-radius:6px;font-family:Inter,system-ui,sans-serif;
  background-image:
    radial-gradient(circle at 0 0,rgba(169,134,42,.10),transparent 38%),radial-gradient(circle at 100% 100%,rgba(15,127,132,.09),transparent 40%),
    repeating-radial-gradient(circle at 50% 118%,transparent 0 1.1cqw,rgba(110,71,99,.035) 1.1cqw 1.2cqw)}
.cert .frame{position:absolute;inset:2.6cqw;border:.28cqw solid var(--aub);border-radius:.6cqw}
.cert .frame::after{content:"";position:absolute;inset:.7cqw;border:.1cqw solid var(--gold);border-radius:.4cqw}
.cert .corner{position:absolute;width:6cqw;height:6cqw;border-color:var(--gold);border-style:solid;border-width:0}
.cert .c1{top:4cqw;left:4cqw;border-top-width:.35cqw;border-left-width:.35cqw}.cert .c2{top:4cqw;right:4cqw;border-top-width:.35cqw;border-right-width:.35cqw}
.cert .c3{bottom:4cqw;left:4cqw;border-bottom-width:.35cqw;border-left-width:.35cqw}.cert .c4{bottom:4cqw;right:4cqw;border-bottom-width:.35cqw;border-right-width:.35cqw}
.cert .in{position:absolute;inset:6.2cqw 8cqw 6.6cqw;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .brand{display:flex;align-items:center;gap:0;font-weight:900;letter-spacing:-.02em;font-size:2.5cqw;color:var(--ink)}
.cert .brand svg{width:5.2cqw;height:auto;margin:0 .1cqw}
.cert .brand .sk{font-family:Caveat,cursive;font-weight:700;color:var(--teal);font-size:2.3cqw;letter-spacing:0;margin-left:1.2cqw}
.cert .kicker{margin-top:2.6cqw;font-weight:800;font-size:1.25cqw;letter-spacing:.55em;text-transform:uppercase;color:var(--aub);padding-left:.55em}
.cert .big{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:5.4cqw;line-height:1;margin:.6cqw 0 0;color:var(--ink);letter-spacing:.01em}
.cert .hand{font-family:Caveat,cursive;color:var(--gold);font-size:2.6cqw;margin-top:.2cqw}
.cert .lbl{font-size:1.35cqw;color:#5d5566;margin-top:2cqw}
.cert .name{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:4.5cqw;line-height:1.1;margin-top:.6cqw;color:var(--ink);
  padding:0 4cqw .6cqw;border-bottom:.12cqw solid rgba(110,71,99,.35);max-width:78cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cert .course{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:2.9cqw;color:var(--aub);margin-top:.5cqw;line-height:1.15;max-width:76cqw}
.cert .scoreline{font-size:1.4cqw;color:#4a4352;margin-top:1.2cqw}
.cert .scoreline b{color:var(--ink)}
.cert .foot{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2cqw}
.cert .col{text-align:left;font-size:1.15cqw;color:#5d5566;line-height:1.45}
.cert .col.r{text-align:right}
.cert .col b{display:block;color:var(--ink);font-size:1.45cqw;font-weight:700;border-top:.1cqw solid rgba(33,30,40,.35);padding-top:.6cqw;margin-bottom:.2cqw}
.cert .col .code{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--ink);letter-spacing:.06em}
.cert .seal{width:12cqw;height:12cqw}
.cert .legal{position:absolute;left:0;right:0;bottom:4.1cqw;text-align:center;font-size:.95cqw;color:#6e6677;letter-spacing:.02em}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.facts i{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts b{color:var(--ink);font-size:14px;word-break:break-word}
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff!important}
  body *{visibility:hidden}
  .certbox,.certbox *{visibility:visible}
  .certbox{position:fixed;left:0;top:0;width:297mm;height:210mm;box-shadow:none;border-radius:0}
  .cert{width:297mm;height:210mm;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sunav-fab,.sunav-panel,.sunav-ov,.top{display:none!important}
}
</style>
</head>
<body>
<div class="top"><span class="blogo">Brand<svg class="beyes" width="34" height="20" viewBox="0 0 100 58"><defs>     <linearGradient id="blg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="50%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>     <linearGradient id="blg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>     <radialGradient id="bli1"><stop offset="0%" stop-color="#C69CB8"/><stop offset="100%" stop-color="#8a5f7c"/></radialGradient>     <radialGradient id="bli2"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="100%" stop-color="#1a9aa0"/></radialGradient>     </defs>     <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#blg1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#bli1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>     <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#blg2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#bli2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>   </svg>ers<span class="sk">SkillUp</span></span><a class="back" href="/app/inicio.html">Inicio</a></div>
<main class="stagec" id="main"><div class="loader"><div class="spin"></div>Cargando el certificado…</div></main>
<script src="/app/i18n.js"></script>
<script src="/app/api.js"></script>
<script>
(function(){
"use strict";
try{ if(localStorage.getItem('skillup-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var main=document.getElementById('main');
var code=new URLSearchParams(location.search).get('code')||'';
var EYES='<svg viewBox="0 0 100 58" aria-hidden="true"><g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#0F7F86" stroke-width="3.4"/><circle cx="20" cy="36" r="7.5" fill="#6E4763"/><circle cx="20" cy="36" r="3.4" fill="#0a0a0f"/></g><g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#A9862A" stroke-width="3.4"/><circle cx="20" cy="36" r="7.5" fill="#0F7F86"/><circle cx="20" cy="36" r="3.4" fill="#0a0a0f"/></g></svg>';
function seal(issuer){
  var t=(issuer||'Brandooers').toUpperCase()+' · SKILLUP · CERTIFICADO · ';
  return '<svg class="seal" viewBox="0 0 120 120" aria-hidden="true"><defs><path id="sc" d="M60,60 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0"/></defs>'
    +'<circle cx="60" cy="60" r="57" fill="#FBF8F2" stroke="#A9862A" stroke-width="2"/><circle cx="60" cy="60" r="52" fill="none" stroke="#6E4763" stroke-width="1" stroke-dasharray="2 3"/>'
    +'<text font-family="Inter,sans-serif" font-size="8.6" font-weight="800" letter-spacing="2.2" fill="#6E4763"><textPath href="#sc">'+E(t)+'</textPath></text>'
    +'<circle cx="60" cy="60" r="33" fill="#6E4763"/><circle cx="60" cy="60" r="29" fill="none" stroke="#E7CE84" stroke-width="1"/>'
    +'<g transform="translate(35,45) scale(.5)">'+EYES.replace('<svg viewBox="0 0 100 58" aria-hidden="true">','').replace('</svg>','').replace(/#0a0a0f/g,'#FBF8F2').replace('stroke="#0F7F86"','stroke="#7DE3E8"')+'</g>'
    +'</svg>';
}
function fmt(d){ try{ return new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } }
function render(c){
  var verifyUrl=location.origin+'/verificar?code='+encodeURIComponent(c.code);
  var legal=c.accreditation?('Certificado acreditado por '+c.accreditation+'. Verificable en '+location.host+'/verificar')
    :('Certificado interno de '+(c.issuer||'Brandooers')+'. No constituye una acreditación oficial. Verificable en '+location.host+'/verificar');
  document.title='Certificado · '+c.title+' · '+(c.holderName||'');
  main.innerHTML='<div class="certbox"><article class="cert" aria-label="Certificado de '+E(c.holderName)+'">'
    +'<div class="frame"></div><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>'
    +'<div class="in"><div class="brand">Brand'+EYES+'ers<span class="sk">SkillUp</span></div>'
    +'<div class="kicker">Certificado</div><div class="big">de superación</div><div class="hand">con evaluación final</div>'
    +'<div class="lbl">Se certifica que</div><div class="name">'+E(c.holderName||'—')+'</div>'
    +'<div class="lbl" style="margin-top:1.4cqw">ha superado la evaluación final del curso</div><div class="course">'+E(c.title)+'</div>'
    +(c.score!=null?'<div class="scoreline">con una calificación de <b>'+E(c.score)+'/100</b> · mínimo exigido 80/100</div>':'')
    +'<div class="foot"><div class="col"><b>'+E(fmt(c.issuedAt))+'</b>Fecha de emisión<br>Emite: '+E(c.issuer||'Brandooers')+'</div>'+seal(c.issuer)
    +'<div class="col r"><b class="code">'+E(c.code)+'</b>Código de verificación<br>'+E(location.host)+'/verificar</div></div></div>'
    +'<div class="legal">'+E(legal)+'</div></article></div>'
    +'<div class="actions"><button class="btn gold" id="pdf">Descargar PDF</button><button class="btn ghost" id="copy">Copiar enlace de verificación</button><a class="btn ghost" href="'+E(verifyUrl)+'">Verificar</a></div>'
    +'<div class="facts"><div><i>Titular</i><b>'+E(c.holderName||'—')+'</b></div><div><i>Curso</i><b>'+E(c.title)+'</b></div><div><i>Nota</i><b>'+(c.score!=null?E(c.score)+'/100':'—')+'</b></div><div><i>Fecha</i><b>'+E(fmt(c.issuedAt))+'</b></div><div><i>Código</i><b>'+E(c.code)+'</b></div><div><i>Tipo</i><b>'+E(c.accreditation?('Acreditado por '+c.accreditation):('Interno de '+(c.issuer||'Brandooers')))+'</b></div></div>';
  document.getElementById('pdf').onclick=function(){ window.print(); };
  document.getElementById('copy').onclick=function(){ var b=this; (navigator.clipboard?navigator.clipboard.writeText(verifyUrl):Promise.reject()).then(function(){ b.textContent='Enlace copiado'; }).catch(function(){ prompt('Copia el enlace:',verifyUrl); }); };
}
function list(){
  SkillUp.requireSession('/app/login.html').then(function(s){ if(!s) return;
    SkillUp.api('/api/certificates/mine').then(function(d){
      var items=(d&&d.items)||[];
      main.innerHTML='<h1 class="pt">Tus certificados</h1><p class="lead">Se consiguen aprobando el examen final de un curso (mínimo 80/100).</p>'
        +(items.length?'<div class="list">'+items.map(function(c){ return '<div class="item"><div class="tx"><b>'+E(c.title)+'</b><small>'+E(fmt(c.issuedAt))+(c.score!=null?' · '+E(c.score)+'/100':'')+' · '+E(c.code)+'</small></div><a class="btn sm" href="/app/certificado.html?code='+encodeURIComponent(c.code)+'">Ver</a></div>'; }).join('')+'</div>'
          :'<div class="card"><p class="muted" style="margin:0">Aún no tienes certificados. Termina un curso y aprueba su examen final.</p></div>');
    }).catch(function(){ main.innerHTML='<div class="card"><p class="err">No se pudieron cargar tus certificados.</p></div>'; });
  });
}
if(!code){ list(); return; }
// Público a propósito: el enlace del certificado se puede compartir. Se pinta con los datos mínimos de la verificación.
fetch('/api/certificates/'+encodeURIComponent(code)+'/verify').then(function(r){ return r.json(); }).then(function(d){
  if(!d || (!d.valid && !d.expired)){ main.innerHTML='<div class="card"><p class="err">No existe ningún certificado con ese código.</p></div>'; return; }
  render({ code:code, title:d.title, holderName:d.holderName, issuedAt:d.issuedAt, score:d.score, issuer:d.issuer, accreditation:d.accreditation });
  if(d.expired){ var w=document.createElement('p'); w.className='err'; w.textContent='Este certificado ha caducado.'; main.insertBefore(w,main.firstChild); }
}).catch(function(){ main.innerHTML='<div class="card"><p class="err">No se pudo cargar el certificado.</p></div>'; });
})();
</script>
</body>
</html>
