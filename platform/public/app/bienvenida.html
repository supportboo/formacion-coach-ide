<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp · Bienvenida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&family=Playfair+Display:wght@700;800;900&display=swap">
<style>
:root{color-scheme:dark;--bg:#1a1820;--panel:#221f2a;--ink:#F2EFF5;--body:#DAD4E2;--muted:#968EA4;
  --aub:#8a5f7c;--aub2:#C69CB8;--teal:#1a9aa0;--teal2:#3FD8E0;--gold:#F0C645;--green:#54C79A;
  --line:rgba(180,150,205,.16);--sh:0 24px 70px rgba(0,0,0,.5);--soft:rgba(255,255,255,.05);
  --ff:"Inter",system-ui,sans-serif;--fh:"Playfair Display",Georgia,serif;--fc:"Caveat",cursive;}
:root[data-theme="light"]{color-scheme:light;--bg:#F3EFE7;--panel:#FFFFFF;--ink:#211E28;--body:#403A48;--muted:#837B90;
  --aub:#7A4E6B;--aub2:#8A5578;--teal:#0F7F86;--teal2:#0B6E78;--gold:#9C7A10;--green:#2E9E73;
  --line:rgba(70,50,90,.16);--sh:0 18px 50px rgba(80,60,100,.12);--soft:rgba(60,42,84,.05);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:var(--ff);color:var(--body);overflow:hidden;
  background:radial-gradient(760px 460px at 50% 20%,rgba(113,75,103,.28),transparent 60%),var(--bg)}
button{font-family:inherit}[hidden]{display:none!important}
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}
.card{width:min(600px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);display:flex;flex-direction:column;max-height:88dvh}
.mascota{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 16px 10px}
.mascota svg{width:96px;height:auto}
.mascota .ir{transition:transform .3s}
.mascota .nm{font-family:var(--fc);color:var(--teal2);font-size:19px}
.conv{flex:1;overflow-y:auto;padding:8px 18px 12px;display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.5;animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.b.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line);color:var(--body);border-bottom-left-radius:4px}
.b.u{align-self:flex-end;background:linear-gradient(120deg,var(--teal),var(--aub));color:#fff;border-bottom-right-radius:4px}
.b.co{align-self:stretch;max-width:100%;background:rgba(63,216,224,.08);border-color:rgba(63,216,224,.3)}
.b.co .lbl{font-family:var(--fc);color:var(--teal2);font-size:16px;display:block;margin-bottom:3px}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:2px 18px 6px}
.chips button{border:1px solid var(--line);background:var(--soft);color:var(--body);border-radius:11px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--aub2);color:var(--ink)}
.chips button{min-height:44px}.chips button.def{border-color:var(--teal2);color:var(--ink)}
.row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.row .mic{width:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--aub2);cursor:pointer;display:grid;place-items:center}
.row .mic.rec{background:#e74c3c;color:#fff;border-color:#e74c3c}
.row input{flex:1;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 14px;font:inherit;font-size:14.5px;outline:none}
.row .snd{border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--teal),var(--aub));flex:none}
.row .snd[disabled]{opacity:.5}
.done{padding:18px;text-align:center}
.done .btn{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--teal),var(--aub));text-decoration:none;display:inline-block}
.skip{margin-top:14px;color:var(--muted);font-size:12.5px;text-decoration:none;display:inline-block}
.loader{min-height:100dvh;display:grid;place-items:center;color:var(--muted);font-size:13px}
@media(prefers-reduced-motion:no-preference){.mascota .ir{animation:blink 4s infinite}@keyframes blink{0%,94%,100%{opacity:1}96%{opacity:.15}98%{opacity:1}}}
.wv-ov{position:fixed;inset:0;z-index:3000;background:rgba(10,8,14,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.wv-card{width:100%;max-width:760px;background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.wv-vidwrap{position:relative;background:#000;aspect-ratio:16/9}
.wv-vidwrap video{width:100%;height:100%;display:block;object-fit:cover}
.wv-body{padding:18px 20px 20px;text-align:center}
.wv-body h3{margin:0 0 6px;color:var(--ink);font-size:20px;letter-spacing:-.02em}
.wv-body p{margin:0 0 16px;color:var(--body);font-size:14px;line-height:1.5}
.wv-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.wv-actions .btn{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--teal),var(--aub))}
.wv-skip{background:none;border:none;color:var(--muted);font-weight:600;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="wv-ov" id="welcomeVideo" style="display:none">
  <div class="wv-card">
    <div class="wv-vidwrap"><video id="wvVid" src="https://brandooers.com/assets/marc-brandooers-explica.mp4?v=5" poster="https://brandooers.com/assets/marc-brandooers-explica-poster.jpg" controls playsinline preload="metadata"></video></div>
    <div class="wv-body">
      <h3 data-i18n="onb.vTitle">Bienvenido a SkillUp</h3>
      <p data-i18n="onb.vText">Antes de empezar, míralo un momento: cómo vas a aprender con casos de tu puesto, cómo demuestras que lo aplicas, los retos que te propondrá tu responsable, el seguimiento y el apoyo que tendrás, y por qué esta formación sí se te queda dentro.</p>
      <div class="wv-actions"><button class="btn" id="wvStart" data-i18n="onb.vStart">Empezar</button><button class="wv-skip" id="wvSkip" data-i18n="onb.vSkip">Saltar el vídeo</button></div>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY='skillup-welcome-video-seen';
  var seen=false; try{ seen=localStorage.getItem(KEY)==='1'; }catch(e){}
  var ov=document.getElementById('welcomeVideo'), v=document.getElementById('wvVid');
  if(seen){ return; } // ya lo vio: no reabrir
  ov.style.display='flex';
  function done(){ try{ v.pause(); }catch(e){} ov.style.display='none'; try{ localStorage.setItem(KEY,'1'); }catch(e){} }
  document.getElementById('wvStart').onclick=done;
  document.getElementById('wvSkip').onclick=done;
  ov.addEventListener('click',function(e){ if(e.target===ov) done(); });
  v.addEventListener('error',done); // si el vídeo no carga, no mostrar un reproductor roto
})();
</script>
<div class="loader" id="loader" data-i18n="onb.loading">Cargando…</div>
<div class="wrap" id="wrap" hidden>
  <div class="card">
    <div class="mascota"><svg viewBox="0 0 100 58" aria-hidden="true"><g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#3FD8E0" stroke-width="3.5"/><circle class="ir" cx="20" cy="36" r="8" fill="#C69CB8"/><circle cx="20" cy="36" r="3.6" fill="#0a0a0f"/></g><g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="#F0C645" stroke-width="3.5"/><circle class="ir" cx="20" cy="36" r="8" fill="#3FD8E0"/><circle cx="20" cy="36" r="3.6" fill="#0a0a0f"/></g></svg><span class="nm" data-i18n="onb.guide">Tu guía</span></div>
    <div class="conv" id="conv"></div>
    <div class="chips" id="chips" hidden></div>
    <div class="row" id="row"><button class="mic" id="mic" aria-label="Hablar" data-i18n-attr="aria-label:dict.talk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg></button><input id="inp" placeholder="Escribe o dicta tu respuesta…" aria-label="Respuesta" data-i18n-attr="placeholder:onb.ph;aria-label:onb.answer"><button class="snd" id="snd" data-i18n="onb.send">Enviar</button></div>
    <div class="done" id="done" hidden></div>
  </div>
</div>
<script src="/app/i18n.js"></script>
<script src="/app/api.js"></script>
<script src="/app/dictation.js"></script>
<script>
(function(){
"use strict";
try{ if(localStorage.getItem('skillup-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
var loader=document.getElementById('loader'), wrap=document.getElementById('wrap');
if(!window.SkillUp||!SkillUp.api){loader.textContent='No se pudo cargar. Vuelve a entrar.';return;}
var conv=document.getElementById('conv'), chipsEl=document.getElementById('chips'), row=document.getElementById('row'), inp=document.getElementById('inp'), done=document.getElementById('done');
function T(k,es,v){return window.SUI18n?SUI18n.t(k,es,v):es;}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
// El scroll al fondo se hace en rAF (doble) para que corra DESPUÉS del reflow y de la animación de
// entrada de la burbuja; si no, en móvil el último mensaje se queda a veces medio tapado.
function scrollDown(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ conv.scrollTop=conv.scrollHeight; }); }); }
function bubble(role,txt,cls){var d=document.createElement('div');d.className='b '+role+(cls?' '+cls:'');if(cls==='co'){d.innerHTML='<span class="lbl">'+esc(T('onb.company','Tu empresa'))+'</span>'+esc(txt);}else{d.textContent=txt;}conv.appendChild(d);scrollDown();return d;}

var STEPS=[
 // 1.14.0: se empieza por la situación real que quiere resolver (se guarda como [objetivo] para no romper tutor ni ruta).
 {tk:'onb.sit',ask:'Para empezar por lo útil: ¿qué situación de tu trabajo te gustaría resolver mejor en las próximas semanas? Elige una o cuéntamela con tus palabras.',key:'objetivo',
  ck:'onb.sitChips',chips:['Conseguir que un posible partner acepte una reunión','Hacer una demo sin perderme en funcionalidades','Responder a una objeción sin conceder demasiado pronto','Organizar mejor mi semana comercial']},
 {t:0,ask:'¿A qué te dedicas? Descríbeme tu puesto con detalle: qué haces, con quién y qué decides.',key:'rol'},
 {t:1,ask:'Genial. ¿Cuál es la web de tu empresa? Le echo un ojo para conoceros y afinar los ejemplos a lo vuestro.',key:'empresa',company:true},
 {tk:'onb.tried',ask:'¿Qué has probado ya con esa situación y qué pasó? Aunque sea poco.',key:'intentado'},
 {t:3,ask:'¿En qué nivel te ves ahora mismo?',key:'nivel',chips:['Empezando','Con experiencia','Con soltura']},
 {t:4,ask:'¿Cuánto tiempo puedes dedicarle a la semana? Sé realista, así te marco un ritmo que puedas cumplir.',key:'ritmo',chips:['Menos de 1 hora','2-3 horas','5 horas o más']},
 {t:5,ask:'¿Qué te suele frenar cuando aprendes algo nuevo? Esto me ayuda a acompañarte mejor.',key:'freno',chips:['Falta de tiempo','Me disperso','No veo el para qué','Me da corte practicar']},
 {t:6,ask:'Y para terminar: ¿cómo prefieres que te hable tu tutor?',key:'trato',chips:['Directo y al grano','Con tacto y calma','Retándome']}
];
var COMPANY_READY=false; // la ficha de empresa validada evita preguntar la web a cada alumno
SkillUp.api('/api/learning/company-ready').then(function(d){ COMPANY_READY=!!(d&&d.ready); }).catch(function(){});
var step=-1, busy=false;
// Pregunta y opciones del paso i en el idioma elegido (i18n.js); el español es la fuente.
function stepAsk(i){ var st=STEPS[i]; if(st.tk) return T(st.tk,st.ask); var tr=T('onb.steps',null); return (tr&&tr[st.t])||st.ask; }
function stepChips(i){ var st=STEPS[i]; if(st.ck){ var c=T(st.ck,null); return Array.isArray(c)?c:st.chips; } var tr=T('onb.chips',null); return (tr&&tr[st.t])||st.chips; }

// Paso 0 (1.5.0): idioma de toda la plataforma. Se propone el del navegador si está soportado; si no, español.
var LANG_Q={es:'Antes de empezar: ¿en qué idioma quieres usar SkillUp? Todo se adaptará: los tutores, los tests, la voz y los vídeos. Puedes cambiarlo cuando quieras desde el menú.'};
function askLang(){
  var I=window.SUI18n; if(!I){ ask(); return; }
  var def=I.browserLang(), D=I._dict||{};
  bubble('a',(D[def]&&D[def]['onb.langQ'])||LANG_Q.es);
  chipsEl.innerHTML=''; chipsEl.hidden=false; row.hidden=true;
  Object.keys(I.LANGS).sort(function(a,b){return (b===def)-(a===def);}).forEach(function(k){
    var b=document.createElement('button'); b.textContent=I.LANGS[k]; b.setAttribute('lang',k); b.dataset.lang=k;
    if(k===def){ b.classList.add('def'); b.setAttribute('aria-pressed','true'); }
    b.onclick=function(){ if(busy)return; busy=true; bubble('u',I.LANGS[k]); chipsEl.hidden=true;
      I.set(k).catch(function(){ I.use(k); }).then(function(){ busy=false; row.hidden=false; setTimeout(ask,300); }); };
    chipsEl.appendChild(b);
  });
}

var ANS={};
function save(key,val){ ANS[key]=val; try{ SkillUp.api('/api/notes/add',{method:'POST',body:{source:'onboarding',kind:'insight',body:'['+key+'] '+val}}).catch(function(){}); }catch(e){} }

function ask(){
  step++;
  while(step<STEPS.length&&STEPS[step].company&&COMPANY_READY) step++;
  if(step>=STEPS.length){ finish(); return; }
  var s=STEPS[step];
  bubble('a',stepAsk(step));
  chipsEl.innerHTML=''; chipsEl.hidden=true;
  var chips=s.chips?stepChips(step):null;
  if(chips){ chipsEl.hidden=false; chips.forEach(function(ch){ var b=document.createElement('button'); b.textContent=ch; b.onclick=function(){ answer(ch); }; chipsEl.appendChild(b); }); }
  inp.focus();
}
async function answer(val){
  val=(val||inp.value).trim(); if(!val||busy)return; busy=true; inp.value=''; chipsEl.hidden=true; chipsEl.innerHTML='';
  bubble('u',val);
  if(MP){ await evalMicro(val); return; }
  var s=STEPS[step];
  if(s.company){
    var t=bubble('a',T('onb.reading','Dame un segundo, estoy leyendo vuestra web…'));
    try{ var r=await SkillUp.api('/api/onboarding/company',{method:'POST',body:{url:val}});
      t.remove(); if(r&&r.summary){ bubble('a',T('onb.understood','Esto es lo que he entendido de vuestra empresa:')); bubble('a',r.summary,'co'); } else { bubble('a',T('onb.cantRead','No he podido leer esa web, pero no pasa nada, seguimos.')); save('empresa',val); }
    }catch(e){ t.remove(); bubble('a',T('onb.cantRead','No he podido leer esa web, pero no pasa nada, seguimos.')); save('empresa',val); }
  } else { save(s.key,val); }
  busy=false;
  setTimeout(ask,400);
}
async function finish(){
  row.hidden=true; chipsEl.hidden=true;
  // Rellena el perfil real (sector/puesto/motivo) que usan tutor, examen y ruta.
  // P5: el sector se PROPONE desde la empresa (su sector de catálogo), no lo teclea el alumno.
  try{
    var sec=await SkillUp.api('/api/catalog/sectors').catch(function(){return [];});
    var sector=(Array.isArray(sec)&&sec.length&&sec[0].name)||undefined;
    await SkillUp.api('/api/learning/onboarding',{method:'POST',body:{puesto:ANS.rol,motivo:ANS.objetivo,sector:sector}}).catch(function(){});
  }catch(e){}
  // 1.14.0: antes del DNA, una micropráctica con su situación real que le deja algo utilizable.
  var t=bubble('a',T('onb.mpPrep','Antes de seguir, una práctica de un minuto con tu situación. Así te dejo algo que puedas usar ya.'));
  try{
    var sc=await SkillUp.api('/api/learning/micropractice',{method:'POST',body:{situacion:ANS.objetivo||'',rol:ANS.rol||''}});
    MP=sc; bubble('a',sc.escenario); bubble('a',sc.pregunta);
    row.hidden=false; inp.focus();
  }catch(e){ showDna(); }
}
var MP=null;
async function evalMicro(val){
  var sc=MP; MP=null; row.hidden=true;
  var t=bubble('a',T('onb.mpEval','Déjame ver tu respuesta…'));
  try{
    var ev=await SkillUp.api('/api/learning/micropractice/eval',{method:'POST',body:{escenario:sc.escenario,pregunta:sc.pregunta,respuesta:val,situacion:ANS.objetivo||''}});
    t.remove();
    bubble('a',ev.bien); bubble('a',ev.mejorar);
    var box=bubble('a','');
    box.innerHTML='<b>'+esc(ev.entregable.titulo)+'</b><ol style="margin:6px 0 0;padding-left:20px">'+ev.entregable.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
    try{ SkillUp.api('/api/notes/add',{method:'POST',body:{source:'onboarding',kind:'note',body:ev.entregable.titulo+': '+ev.entregable.items.join(' · ')}}).catch(function(){}); }catch(e2){}
  }catch(e){ t.remove(); }
  busy=false; showDna();
}
function showDna(){
  row.hidden=true; chipsEl.hidden=true;
  bubble('a',T('onb.done',"Listo, ya te conozco un poco. Ahora, tu ADN de aprendizaje: con los dos primeros bloques (unos 5 minutos) todo se adapta ya a cómo aprendes. El resto lo terminas cuando quieras y al final tendrás tu arquetipo y tu certificado."));
  done.hidden=false;
  done.innerHTML='<a class="btn" href="/app/team-dna.html">'+esc(T('onb.dna','Descubrir mi ADN'))+'</a>';
}

// dictado
var mic=document.getElementById('mic');
SkillUpDictation.attach(mic,{append:true,get:function(){return inp.value;},set:function(v){inp.value=v;}});
document.getElementById('snd').onclick=function(){answer();};
inp.addEventListener('keydown',function(e){if(e.key==='Enter')answer();});

var FORCE_APP=/[?&]app=1/.test(location.search);
SkillUp.requireSession('/app/login.html').then(function(sess){ if(!sess) return;
  SkillUp.api('/api/org/me').catch(function(){return null;}).then(function(d){
    if(d && d.platformAdmin && !FORCE_APP){ location.href='/app/superadmin.html'; return; }
    loader.hidden=true; wrap.hidden=false;
    if(d && d.langChosen) ask(); else askLang();
  });
});
})();
</script>
<script src="/app/chat-stick.js" defer></script>
</body>
</html>
