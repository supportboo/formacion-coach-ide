<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp · Demuéstralo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/assess.css">
<style>
.rules{margin:0 0 14px;padding-left:18px;display:grid;gap:6px;color:var(--body)}
.esc{color:var(--ink);font-size:16px;line-height:1.55;margin:6px 0 10px}
.q{color:var(--ink);font-weight:700;margin:0 0 12px}
.ansrow{display:flex;gap:8px;align-items:flex-start}
.ansrow textarea{flex:1;min-width:0;min-height:180px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;line-height:1.5;padding:12px}
.mic{flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.mic.on{border-color:#3FD8E0;color:#3FD8E0}
.foot{display:flex;justify-content:space-between;font-size:12.5px;margin:6px 0 12px}
.score{font:800 44px/1 Inter,system-ui,sans-serif;color:var(--ink)}
.crit{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.crit li{border-top:1px solid var(--line);padding-top:10px}
.crit b{color:var(--ink)}.crit q{display:block;color:var(--muted);font-style:italic;font-size:13.5px;margin-top:3px}
.tag{font:700 11.5px Inter,system-ui,sans-serif;border-radius:999px;padding:2px 9px;margin-right:6px}
.t-si{background:rgba(46,158,115,.2);color:#2E9E73}.t-parcial{background:rgba(201,138,27,.2);color:#C98A1B}.t-no{background:rgba(208,73,63,.18);color:#D0493F}
</style>
</head>
<body>
<div class="top"><span class="blogo">Brand<svg class="beyes" width="34" height="20" viewBox="0 0 100 58"><defs>     <linearGradient id="blg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="50%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>     <linearGradient id="blg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8a5f7c"/><stop offset="100%" stop-color="#C69CB8"/></linearGradient>     <radialGradient id="bli1"><stop offset="0%" stop-color="#C69CB8"/><stop offset="100%" stop-color="#8a5f7c"/></radialGradient>     <radialGradient id="bli2"><stop offset="0%" stop-color="#3FD8E0"/><stop offset="100%" stop-color="#1a9aa0"/></radialGradient>     </defs>     <g transform="translate(5,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#blg1)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#bli1)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>     <g transform="translate(53,0)"><ellipse cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#blg2)" stroke-width="3"/><circle cx="20" cy="36" r="7.5" fill="url(#bli2)"/><circle cx="20" cy="36" r="3.5" fill="#0a0a0f"/></g>   </svg>ers<span class="sk">SkillUp</span></span><a class="back" href="/app/ficha.html">Volver</a></div>
<main class="wrap" id="wrap">
<h1 class="pt" id="title">Demuéstralo sin ayuda</h1>
<p class="lead" id="lead"></p>
<div class="card" id="intro">
  <ul class="rules" id="rules"></ul>
  <button class="btn" id="go" type="button">EMPEZAR</button>
  <p class="muted" id="msg" aria-live="polite" style="margin:10px 0 0"></p>
</div>
<div class="card" id="task" hidden>
  <p class="muted" style="margin:0 0 4px;font-size:13px" id="meta"></p>
  <p class="esc" id="esc"></p>
  <p class="q" id="q"></p>
  <label for="ans" class="muted" style="font-size:13px">Tu respuesta</label>
  <div class="ansrow"><textarea id="ans" rows="9" maxlength="4000" placeholder="Escribe como lo harías de verdad…"></textarea>
  <button class="mic" id="mic" type="button" aria-label="Hablar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button></div>
  <div class="foot"><span class="muted" id="count">0 caracteres</span><span class="muted" id="clock">0:00</span></div>
  <p class="muted" id="paste" aria-live="polite" style="margin:6px 0 0"></p>
  <button class="btn" id="send" type="button">ENTREGAR</button>
  <p class="muted" id="smsg" aria-live="polite" style="margin:10px 0 0"></p>
</div>
<div id="result" aria-live="polite"></div>
</main>
<script src="/app/i18n.js"></script>
<script src="/app/api.js"></script>
<script src="/app/dictation.js"></script>
<script src="/app/nav.js" defer></script>
<script>
(function(){
"use strict";
try{ if(localStorage.getItem('skillup-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
function $(id){ return document.getElementById(id); }
function e(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var P=new URLSearchParams(location.search), SKILL=P.get('skill')||'', MODE=P.get('modo')==='teach_back'?'teach_back':'demostracion', ID=null, T0=0, tick=null;
var TEACH=MODE==='teach_back';
document.title='SkillUp · '+(TEACH?'Explícaselo a un compañero':'Demuéstralo sin ayuda');
$('title').textContent=TEACH?'Explícaselo a un compañero':'Demuéstralo sin ayuda';
$('lead').textContent=TEACH?'Enseñar obliga a ordenar lo que sabes. Te diré qué conceptos has cubierto y qué te ha faltado.':'Una situación de tu trabajo que resuelves tú solo. Así se ve lo que haces cuando la IA no te resuelve el trabajo.';
$('rules').innerHTML=(TEACH?['Explícalo como se lo contarías a alguien que entra mañana en tu equipo.','Sin mirar el curso: lo que no te salga es justo lo que te conviene repasar.','Puedes escribir o dictar con el micro. Unos 3 minutos bastan.','Cuenta como evidencia de transferencia; no te da N3 por sí solo.']
  :['Aquí no hay tutor ni pistas: responde como lo harías de verdad.','Pegar texto está desactivado: escribe o dicta tú.','Te revisamos conducta a conducta, con frases literales de tu respuesta como prueba.','No es un examen: es la evidencia más valiosa de tu capacidad.']).map(function(r){ return '<li>'+e(r)+'</li>'; }).join('');
if(!SKILL){ $('go').disabled=true; $('msg').textContent='Entra desde «Tu capacidad» para elegir el tema.'; }
$('go').onclick=async function(){ var b=this; b.disabled=true; $('msg').textContent=TEACH?'Eligiendo un tema de lo que ya has trabajado…':'Preparando una situación con el contenido real del curso y lo que sé de tu trabajo…';
  try{ var s=await SkillUp.api('/api/learning/demo/start',{method:'POST',body:{skillKey:SKILL,mode:MODE}}); ID=s.id;
    $('meta').textContent=s.skillName+' · '+s.block; $('esc').textContent=s.escenario; $('q').textContent=s.pregunta;
    $('intro').hidden=true; $('task').hidden=false; $('ans').focus(); T0=Date.now();
    tick=setInterval(function(){ var t=Math.floor((Date.now()-T0)/1000); $('clock').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); },1000);
  }catch(ex){ $('msg').textContent=ex.message||'No se ha podido preparar ahora.'; b.disabled=false; } };
$('ans').addEventListener('input',function(){ $('count').textContent=this.value.length+' caracteres'; });
if(!TEACH) $('ans').addEventListener('paste',function(ev){ ev.preventDefault(); $('paste').textContent='En una demostración escribe o dicta tú: pegar texto está desactivado.'; });
if(window.SkillUpDictation) SkillUpDictation.attach($('mic'),{append:true,get:function(){return $('ans').value;},set:function(v){ $('ans').value=v; $('count').textContent=v.length+' caracteres'; }}); else $('mic').hidden=true;
var LBL={si:'Cumple',parcial:'A medias',no:'No aparece'};
$('send').onclick=async function(){ var b=this, v=$('ans').value.trim(); if(v.length<40){ $('smsg').textContent='Escribe un poco más: al menos un par de frases.'; return; }
  b.disabled=true; $('smsg').textContent='Revisando conducta a conducta…';
  try{ var r=await SkillUp.api('/api/learning/demo/submit',{method:'POST',body:{id:ID,respuesta:v}}); clearInterval(tick);
    $('task').hidden=true;
    var h='<div class="card"><p class="muted" style="margin:0">'+(TEACH?'Tu explicación':'Tu demostración sin ayuda')+' · '+e(r.block)+'</p><div class="score">'+r.score+'<span style="font-size:18px;color:var(--muted)">/100</span></div>';
    if(r.bien) h+='<p style="margin:10px 0 4px"><b style="color:var(--ink)">Lo mejor:</b> '+e(r.bien)+'</p>';
    if(r.mejorar) h+='<p style="margin:0"><b style="color:var(--ink)">Para la próxima:</b> '+e(r.mejorar)+'</p>';
    h+='<h2 style="font-size:16px;margin:16px 0 0">'+(TEACH?'Conceptos del bloque':'Conductas que buscábamos')+'</h2><ul class="crit">'+r.criterios.map(function(c){ return '<li><span class="tag t-'+c.cumple+'">'+LBL[c.cumple]+'</span><b>'+e(c.criterio)+'</b>'+(c.cita?'<q>«'+e(c.cita)+'»</q>':'')+'</li>'; }).join('')+'</ul>';
    if(TEACH){ h+='<p class="muted" style="margin:12px 0 0">Ejemplo concreto: '+(r.ejemplo?'sí':'no')+(r.claridad?' · Claridad: '+r.claridad+'/5':'')+'</p>';
      if(r.lagunas&&r.lagunas.length) h+='<p style="margin:8px 0 0"><b style="color:var(--ink)">Lo que te ha faltado:</b></p><ul style="margin:4px 0 0;padding-left:18px">'+r.lagunas.map(function(x){return '<li>'+e(x)+'</li>';}).join('')+'</ul>'; }
    h+='<p class="muted" style="margin:14px 0 0;font-size:13px">La nota sale de las conductas con prueba literal en tu respuesta: lo que no se puede señalar en tu texto no cuenta. Queda en tu capacidad como evidencia '+(TEACH?'de transferencia.':'hecha sin ayuda.')+'</p>';
    h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><a class="btn" href="/app/ficha.html">VER TU CAPACIDAD</a><a class="btn" style="background:transparent;border:1px solid var(--line);color:var(--ink)" href="'+e(location.pathname+location.search)+'">OTRA</a></div></div>';
    $('result').innerHTML=h; window.scrollTo(0,0);
  }catch(ex){ $('smsg').textContent=ex.message||'No se ha podido revisar ahora.'; b.disabled=false; } };
})();
</script>
</body>
</html>
