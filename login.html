<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandooers · Acceso</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#714B67;--t:#017E84;--ink:#2D2D2D;--body:#4A4A4A;--mut:#8F8F8F;--bg:#FAFAFA;--line:#E8E0E5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:radial-gradient(circle at 18% 12%,rgba(0,212,255,.06),transparent 42%),radial-gradient(circle at 84% 88%,rgba(236,72,153,.06),transparent 42%),radial-gradient(circle at 60% 50%,rgba(139,92,246,.04),transparent 55%)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(113,75,103,.08)}
.brand{text-align:center;margin-bottom:8px}
/* Logo Brandooers (ojos con degradado de marca) */
.brandooers-logo{display:inline-flex;align-items:baseline;font-family:'Inter',sans-serif;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ink);user-select:none}
.brandooers-logo .beyes{display:inline-block;align-self:center;margin:0 1px}
.beyes .socketL,.beyes .socketR,.beyes .irisL,.beyes .irisR,.beyes .pupilL,.beyes .pupilR,.beyes .glint{transform-box:fill-box;transform-origin:center;animation:bBlink 5.2s infinite}
@keyframes bBlink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}98%{transform:scaleY(1)}}
.sub{font-family:'Caveat',cursive;font-size:22px;color:var(--t);margin:6px 0 26px;text-align:center}
label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:14px 0 5px}
input{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;transition:border .15s}
input:focus{outline:none;border-color:var(--p)}
button{width:100%;margin-top:22px;font-family:inherit;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--p);border:0;border-radius:10px;padding:13px;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.92}button:disabled{opacity:.5;cursor:default}
.err{color:#c92a2a;font-size:13px;margin-top:14px;text-align:center;min-height:18px}
.foot{margin-top:16px;text-align:center;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="bo-bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="bo-bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="bo-brow1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="bo-brow2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<radialGradient id="bo-iris1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#5B21B6"/></radialGradient>
<radialGradient id="bo-iris2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient>
</defs></svg>
<form class="card" id="f">
  <div class="brand">
    <span class="brandooers-logo" style="font-size:34px">Brand<svg class="beyes" width="60" height="34" viewBox="0 0 100 58"><g transform="translate(5,0)"><ellipse class="socketL" cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#bo-bg1)" stroke-width="3"/><circle class="irisL" cx="20" cy="36" r="7.5" fill="url(#bo-iris1)"/><circle class="pupilL" cx="20" cy="36" r="3.5" fill="#0a0a0f"/><circle class="glint" cx="23" cy="33" r="2" fill="#fff"/></g><g transform="translate(53,0)"><ellipse class="socketR" cx="20" cy="36" rx="18" ry="18" fill="none" stroke="url(#bo-bg2)" stroke-width="3"/><circle class="irisR" cx="20" cy="36" r="7.5" fill="url(#bo-iris2)"/><circle class="pupilR" cx="20" cy="36" r="3.5" fill="#0a0a0f"/><circle class="glint" cx="23" cy="33" r="2" fill="#fff"/></g></svg>ers</span>
  </div>
  <p class="sub">Acceso del equipo</p>
  <label for="u">Usuario</label>
  <input id="u" name="u" autocomplete="username" autofocus required>
  <label for="p">Contraseña</label>
  <input id="p" name="p" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e"></div>
  <p class="foot"><a href="#" id="forgot" style="color:var(--p);text-decoration:none;font-weight:600">¿Olvidaste tu contraseña?</a></p>
  <p class="foot">Acceso privado. Si no tienes cuenta, pídesela a tu administrador.</p>
</form>
<script>
var f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async function(ev){
  ev.preventDefault(); e.textContent=''; e.style.color='#c92a2a'; b.disabled=true; b.textContent='Entrando…';
  try{
    var r=await fetch('/auth/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({u:document.getElementById('u').value.trim(),p:document.getElementById('p').value})});
    var d=await r.json();
    if(r.ok&&d.ok){ location.href='/hub.html'; return; }
    e.textContent=d.error||'No se pudo entrar';
  }catch(_){ e.textContent='Error de conexión'; }
  b.disabled=false; b.textContent='Entrar';
});
document.getElementById('forgot').addEventListener('click',async function(ev){
  ev.preventDefault();
  var u=document.getElementById('u').value.trim();
  if(!u){ e.style.color='#c92a2a'; e.textContent='Escribe tu usuario arriba y pulsa de nuevo'; document.getElementById('u').focus(); return; }
  try{ await fetch('/auth/forgot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({u:u})}); }catch(_){}
  e.style.color='#2b8a3e'; e.textContent='Si la cuenta existe, se ha generado un enlace de recuperación. Tu administrador o tu correo te lo harán llegar.';
});
</script>
</body>
</html>
